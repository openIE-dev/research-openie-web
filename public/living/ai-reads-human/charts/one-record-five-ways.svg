Brains Mono,monospace">XML  (150 bytes)</text><text xml:space="preserve" x="36" y="420" font-size="11" fill="#E2E8F0" text-anchor="start" font-weight="400" font-family="JetBrains Mono,monospace">&lt;rec id="0" active="false" score="514.799" count="748142501"&gt;&lt;name&gt;epsilon omega </text><text xml:space="preserve" x="36" y="436" font-size="11" fill="#E2E8F0" text-anchor="start" font-weight="400" font-family="JetBrains Mono,monospace">sigma&lt;/name&gt;&lt;tag&gt;sigma&lt;/tag&gt;&lt;tag&gt;kappa&lt;/tag&gt;&lt;tag&gt;omicron&lt;/tag&gt;&lt;/rec&gt;</text><rect x="24" y="452" width="852" height="40" fill="#141b24" stroke="#00D4AA" stroke-width="1" rx="6"/><text xml:space="preserve" x="36" y="469" font-size="11" fill="#00D4AA" text-anchor="start" font-weight="600" font-family="JetBrains Mono,monospace">Fixed binary (hex view)  (23 bytes)</text><text xml:space="preserve" x="36" y="488" font-size="11" fill="#E2E8F0" text-anchor="start" font-weight="400" font-family="JetBrains Mono,monospace">00 00 00 00 08 ac 1c 5a 64 16 80 40 00 a5 bf 97 2c 04 17 11 11 09 0e</text><text xml:space="preserve" x="24" y="514" font-size="11" fill="#64748B" text-anchor="start" font-weight="400" font-family="Inter,system-ui,sans-serif">Long lines are wrapped for display only. Byte counts are for the record text (line break included). The binary form needs the shared word list to be read back.</text></svg>
