<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" role="img" aria-labelledby="t d"><title id="t">One record in five encodings</title><desc id="d">CSV, JSON, YAML, XML and a fixed binary layout carrying the same fields.</desc><rect width="900" height="530" fill="#0F1419" rx="10"/><text xml:space="preserve" x="24" y="32" font-size="18" fill="#E2E8F0" text-anchor="start" font-weight="600" font-family="Inter,system-ui,sans-serif">One record, five encodings</text><text xml:space="preserve" x="24" y="54" font-size="12" fill="#94A3B8" text-anchor="start" font-weight="400" font-family="Inter,system-ui,sans-serif">Record 0 of the synthetic corpus (scripts/gen_corpus.py, seed 20261016). Same information, different bytes.</text><rect x="24" y="84" width="852" height="40" fill="#141b24" stroke="#64748B" stroke-width="1" rx="6"/><text xml:space="preserve" x="36" y="101" font-size="11" fill="#64748B" text-anchor="start" font-weight="600" font-family="JetBrains Mono,monospace">CSV  (66 bytes)</text><text xml:space="preserve" x="36" y="120" font-size="11" fill="#E2E8F0" text-anchor="start" font-weight="400" font-family="JetBrains Mono,monospace">0,epsilon omega sigma,514.799,false,sigma,kappa,omicron,748142501</text><rect x="24" y="136" width="852" height="56" fill="#141b24" stroke="#F59E0B" stroke-width="1" rx="6"/><text xml:space="preserve" x="36" y="153" font-size="11" fill="#F59E0B" text-anchor="start" font-weight="600" font-family="JetBrains Mono,monospace">JSON compact  (122 bytes)</text><text xml:space="preserve" x="36" y="172" font-size="11" fill="#E2E8F0" text-anchor="start" font-weight="400" font-family="JetBrains Mono,monospace">{"id":0,"name":"epsilon omega </text><text xml:space="preserve" x="36" y="188" font-size="11" fill="#E2E8F0" text-anchor="start" font-weight="400" font-family="JetBrains Mono,monospace">sigma","score":514.799,"active":false,"tags":["sigma","kappa","omicron"],"count":748142501}</text><rect x="24" y="204" width=