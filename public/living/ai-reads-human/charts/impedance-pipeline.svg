<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d"><title id="t">Impedance tax pipeline</title><desc id="d">Five stages: encode, transport, parse, tokenize, model reads.</desc><rect width="900" height="300" fill="#0F1419" rx="10"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#94A3B8"/></marker></defs><text xml:space="preserve" x="24" y="32" font-size="18" fill="#E2E8F0" text-anchor="start" font-weight="600" font-family="Inter,system-ui,sans-serif">Where the impedance tax is paid</text><text xml:space="preserve" x="24" y="54" font-size="12" fill="#94A3B8" text-anchor="start" font-weight="400" font-family="Inter,system-ui,sans-serif">Terms of Z(F) defined in the text. Each box is a cost that a canonical machine form could shrink or skip.</text><rect x="24" y="100" width="148" height="76" rx="8" fill="#141b24" stroke="#F59E0B"/><text xml:space="preserve" x="98" y="132" font-size="14" fill="#E2E8F0" text-anchor="middle" font-weight="600" font-family="Inter,system-ui,sans-serif">encode</text><text xml:space="preserve" x="98" y="156" font-size="12" fill="#F59E0B" text-anchor="middle" font-weight="400" font-family="JetBrains Mono,monospace">E_enc</text><rect x="200" y="100" width="148" height="76" rx="8" fill="#141b24" stroke="#F59E0B"/><text xml:space="preserve" x="274" y="132" font-size="14" fill="#E2E8F0" text-anchor="middle" font-weight="600" font-family="Inter,system-ui,sans-serif">transport</text><text xml:space="preserve" x="274" y="156" font-size="12" fill="#F59E0B" text-anchor="middle" font-weight="400" font-family="JetBrains Mono,monospace">bytes B_F</text><rect x="376" y="100" width="148" height="76" rx="8" fill="#141b24" stroke="#F59E0B"/><text xml:space="preserve" x="450" y="132" font-size="14" fill="#E2E8F0" text-anchor="middle" font-weight="600" font-family="Inter,system-ui,sans-serif">parse</text><text xml:space="preserve" x="450" y="156" font-size="12" fill="#F59E0B" text-anchor="middle" font-weight="400" font-family="JetBrains Mono,monospace">E_parse</text><rect x="552" y="100" width="148" height="76" rx="8" fill="#141b24" stroke="#F59E0B"/><text xml:space="preserve" x="626" y="132" font-size="14" fill="#E2E8F0" text-anchor="middle" font-weight="600" font-family="Inter,system-ui,sans-serif">tokenize</text><text xml:space="preserve" x="626" y="156" font-size="12" fill="#F59E0B" text-anchor="middle" font-weight="400" font-family="JetBrains Mono,monospace">E_tok</text><rect x="728" y="100" width="148" height="76" rx="8" fill="#141b24" stroke="#F59E0B"/><text xml:space="preserve" x="802" y="132" font-size="14" fill="#E2E8F0" text-anchor="middle" font-weight="600" font-family="Inter,system-ui,sans-serif">model reads</text><text xml:space="preserve" x="802" y="156" font-size="12" fill="#F59E0B" text-anchor="middle" font-weight="400" font-family="JetBrains Mono,monospace">e_prefill x T</text><path d="M174 138 l22 0" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/><path d="M350 138 l22 0" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/><path d="M526 138 l22 0" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/><path d="M702 138 l22 0" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/><text xml:space="preserve" x="24" y="214" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="400" font-family="Inter,system-ui,sans-serif">Machine to machine: only encode, transport and parse apply. A fixed layout can be read in place.</text><text xml:space="preserve" x="24" y="238" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="400" font-family="Inter,system-ui,sans-serif">Machine to model: tokenize and read apply. Sending fewer, better chosen fields cuts the last two boxes.</text><text xml:space="preserve" x="24" y="278" font-size="12" fill="#64748B" text-anchor="start" font-weight="400" font-family="Inter,system-ui,sans-serif">Only time and token counts are measured so far. Joules for every box are planned (M4, M5).</text></svg>
