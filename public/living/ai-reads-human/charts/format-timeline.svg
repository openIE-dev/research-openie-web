ce="preserve" x="330" y="325" font-size="11" fill="#94A3B8" text-anchor="end" font-weight="400" font-family="JetBrains Mono,monospace">28 January 2024</text><line x1="430" y1="320" x2="870" y2="320" stroke="#27313d" stroke-dasharray="1 4"/><circle cx="851.5" cy="320" r="5" fill="#F59E0B"/><text xml:space="preserve" x="24" y="388" font-size="11" fill="#64748B" text-anchor="start" font-weight="400" font-family="Inter,system-ui,sans-serif">Position is the year (to the month where printed). Sources: ledger rows S01, S03, S06, S07, S02, S10, S12, tex.web.</text></svg>
