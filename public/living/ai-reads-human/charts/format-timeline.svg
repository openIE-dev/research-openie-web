<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d"><title id="t">Timeline of format specifications</title><desc id="d">Nine dated specifications from 1982 to 2024.</desc><rect width="900" height="400" fill="#0F1419" rx="10"/><text xml:space="preserve" x="24" y="32" font-size="18" fill="#E2E8F0" text-anchor="start" font-weight="600" font-family="Inter,system-ui,sans-serif">Dates of the specifications read for this topic</text><text xml:space="preserve" x="24" y="54" font-size="12" fill="#94A3B8" text-anchor="start" font-weight="400" font-family="Inter,system-ui,sans-serif">Each date is printed in the document named in the right-hand label; all are in the read ledger.</text><line x1="430.0" y1="70" x2="430.0" y2="342" stroke="#27313d"/><text xml:space="preserve" x="430.0" y="358" font-size="11" fill="#94A3B8" text-anchor="middle" font-weight="400" font-family="JetBrains Mono,monospace">1980</text><line x1="525.6521739130435" y1="70" x2="525.6521739130435" y2="342" stroke="#27313d"/><text xml:space="preserve" x="525.6521739130435" y="358" font-size="11" fill="#94A3B8" text-anchor="middle" font-weight="400" font-family="JetBrains Mono,monospace">1990</text><line x1="621.304347826087" y1="70" x2="621.304347826087" y2="342" stroke="#27313d"/><text xml:space="preserve" x="621.304347826087" y="358" font-size="11" fill="#94A3B8" text-anchor="middle" font-weight="400" font-family="JetBrains Mono,monospace">2000</text><line x1="716.9565217391305" y1="70" x2="716.9565217391305" y2="342" stroke="#27313d"/><text xml:space="preserve" x="716.9565217391305" y="358" font-size="11" fill="#94A3B8" text-anchor="middle" font-weight="400" font-family="JetBrains Mono,monospace">2010</text><line x1="812.6086956521739" y1="70" x2="812.6086956521739" y2="342" stroke="#27313d"/><text xml:space="preserve" x="812.6086956521739" y="358" font-size="11" fill="#94A3B8" text-anchor="middle" font-weight="400" font-family="JetBrains Mono,monospace">2020</text><text xml:space="preserve" x="24" y="85" font-size="13" fill="#E2E8F0" text-anchor="start" font-weight="400" font-family="Inter,system-ui,sans-serif">TeX version 0</text><text xml:space="preserve" x="330" y="85" font-size="11" fill="#94A3B8" text-anchor="end" font-weight="400" font-family="JetBrains Mono,monospace">September 1982</text><line x1="430" y1="80" x2="870" y2="80" stroke="#27313d" stroke-dasharray="1 4"/><circle cx="455.8" cy="80" r="5" fill="#F59E0B"/><text xml:space="preserve" x="24" y="115" font-size="13" fill="#E2E8F0" text-anchor="start" font-weight="400" font-family="Inter,system-ui,sans-serif">Markdown</text><text xml:space="preserve" x="330" y="115" font-size="11" fill="#94A3B8" text-anchor="end" font-weight="400" font-family="JetBrains Mono,monospace">2004</text><line x1="430" y1="110" x2="870" y2="110" stroke="#27313d" stroke-dasharray="1 4"/><circle cx="659.6" cy="110" r="5" fill="#F59E0B"/><text xml:space="preserve" x="24" y="145" font-size="13" fill="#E2E8F0" text-anchor="start" font-weight="400" font-family="Inter,system-ui,sans-serif">CSV, RFC 4180 (informational)</text><text xml:space="preserve" x="330" y="145" font-size="11" fill="#94A3B8" text-anchor="end" font-weight="400" font-family="JetBrains Mono,monospace">October 2005</text><line x1="430" y1="140" x2="870" y2="140" stroke="#27313d" stroke-dasharray="1 4"/><circle cx="676.8" cy="140" r="5" fill="#F59E0B"/><text xml:space="preserve" x="24" y="175" font-size="13" fill="#E2E8F0" text-anchor="start" font-weight="400" font-family="Inter,system-ui,sans-serif">I-JSON, RFC 7493</text><text xml:space="preserve" x="330" y="175" font-size="11" fill="#94A3B8" text-anchor="end" font-weight="400" font-family="JetBrains Mono,monospace">March 2015</text><line x1="430" y1="170" x2="870" y2="170" stroke="#27313d" stroke-dasharray="1 4"/><circle cx="766.7" cy="170" r="5" fill="#F59E0B"/><text xml:space="preserve" x="24" y="205" font-size="13" fill="#E2E8F0" text-anchor="star