<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t2 d2">
  <title id="t2">Commit compose: lut_allow AND energy_ok</title>
  <desc id="d2">Block diagram of the toy Stage C commit gate driving LEDs.</desc>
  <rect width="760" height="340" fill="#0b1220"/>
  <text x="24" y="32" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="13">Figure · commit compose (toy Stage C fabric)</text>
  <text x="24" y="56" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="18" font-weight="600">commit = lut_allow AND energy_ok</text>
  <!-- counter -->
  <rect x="40" y="100" width="140" height="70" rx="8" fill="#111827" stroke="#475569"/>
  <text x="58" y="130" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="13">24-bit counter</text>
  <text x="58" y="150" fill="#64748b" font-family="ui-monospace,monospace" font-size="11">+1 each clk</text>
  <!-- arrows -->
  <path d="M180 125 H220" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M180 145 H220" stroke="#64748b" stroke-width="2"/>
  <!-- bit extract boxes -->
  <rect x="220" y="70" width="150" height="55" rx="8" fill="#0c4a6e" stroke="#38bdf8"/>
  <text x="235" y="95" fill="#7dd3fc" font-family="ui-monospace,monospace" font-size="12">bit2 clear?</text>
  <text x="235" y="113" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12">lut_allow</text>
  <rect x="220" y="145" width="150" height="55" rx="8" fill="#4c1d95" stroke="#a78bfa"/>
  <text x="235" y="170" fill="#c4b5fd" font-family="ui-monospace,monospace" font-size="12">bit20 set?</text>
  <text x="235" y="188" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12">energy_ok</text>
  <rect x="220" y="230" width="150" height="45" rx="8" fill="#78350f" stroke="#fbbf24"/>
  <text x="235" y="258" fill="#fcd34d" font-family="ui-monospace,monospace" font-size="12">bit23 → heartbeat</text>
  <!-- AND -->
  <path d="M370 97 H410" stroke="#64748b" stroke-width="2"/>
  <path d="M370 172 H410" stroke="#64748b" stroke-width="2"/>
  <rect x="410" y="105" width="100" height="60" rx="8" fill="#064e3b" stroke="#34d399"/>
  <text x="435" y="140" fill="#6ee7b7" font-family="ui-monospace,monospace" font-size="16">AND</text>
  <!-- commit / refuse -->
  <path d="M510 135 H550" stroke="#64748b" stroke-width="2"/>
  <rect x="550" y="70" width="160" height="50" rx="8" fill="#065f46" stroke="#10b981"/>
  <text x="570" y="100" fill="#6ee7b7" font-family="ui-monospace,monospace" font-size="13">led0 commit</text>
  <rect x="550" y="140" width="160" height="50" rx="8" fill="#7f1d1d" stroke="#ef4444"/>
  <text x="570" y="170" fill="#fca5a5" font-family="ui-monospace,monospace" font-size="13">led1 refuse = NOT</text>
  <path d="M370 252 H550" stroke="#64748b" stroke-width="2"/>
  <rect x="550" y="230" width="160" height="45" rx="8" fill="#78350f" stroke="#fbbf24"/>
  <text x="570" y="258" fill="#fcd34d" font-family="ui-monospace,monospace" font-size="13">led7 heartbeat</text>
  <text x="40" y="310" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">Toy predicates only. Not a full Wise Computer Automation (WCA) system-on-chip (SoC). Energy_ok here is a free-running bit, not a meter.</text>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
