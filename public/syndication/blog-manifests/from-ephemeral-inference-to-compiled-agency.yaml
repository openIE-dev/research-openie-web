sections:
  - heading: null
    content: |
      *Signed Provenance · Self-Checked (`human_in_gate = false`; [Verification](https://blog.openie.dev/verification/) · [Glossary](https://blog.openie.dev/glossary/)) · Canonical Post-Review Position Paper: [https://blog.openie.dev/posts/from-ephemeral-inference-to-compiled-agency/](https://blog.openie.dev/posts/from-ephemeral-inference-to-compiled-agency/) · Interactive Observatory: [https://research.openie.dev/living/compiled-agency/](https://research.openie.dev/living/compiled-agency/)*

      Across physical DC current shunts on AMD Kria KV260 (`TI INA260` `SOM_5V_DC`, `measured_j`) and NVIDIA Jetson AGX Thor (`TI INA3221` `VDD_CPU_SOC_MSS` + `TI INA238` `VIN_CARRIER`, `measured_j`), compressing a `512x512` matrix `52.72x` to `0.1517 bpw` and unpacking to `FP32` at runtime imposed an `81.86x` gross (`71.91x` net) energy penalty on KV260 (`19.08x` on Thor), whereas packed integer execution (`FWHT + XNOR + popcount + 4-bit LUT`), 4-ISA `waiOS` integer lockstep (`0/400` schedule disagreements), and a 4-stage lookup-first cascade cut KV260 `measured_j` `26.58x` gross (`24.49x` net) and Thor `measured_j` `16.26x` (`@ 813eb96`).

  - heading: "Key Claims & Evidence Tags"
    content: |
      1. **[E · Sub-Bit Decompression Impedance Tax vs. Packed Integer (`measured_j`)]** Unpacking `0.1517 bpw` weights to `FP32` on KV260 `INA260` cost `63,335.56 uJ` gross (`3,813.32 uJ` net) vs. `773.74 uJ` gross (`53.03 uJ` net) for dense `INT8` (`81.86x` gross / `71.91x` net penalty); staying in Packed Integer used `187.49 uJ` gross (`10.30 uJ` net, `4.13x` below `INT8`), and `104.44 uJ` gross on Jetson Thor `INA3221` (`7.95x` below `INT8`).
      2. **[E · 4-ISA `waiOS` Verifiable Integer Lockstep]** Canonical `256x128` ternary execution matched `BLAKE3` `a541323b13653ed36515ff24ef08deb7dfa771e570a434712708fb72552f46f0` across 5 lanes x 4 substrates (`0/400` randomized 4-worker disagreements, 95% UB `<= 0.00746`), halting immediately (`4ac7c4fb...69dc`, `receipt_sealed = false`) under Row-77 single-weight tamper (`w[77,0]: 0 -> 1`).
      3. **[E · 4-Stage Lookup-First Cascade (`measured_j ⊥ reported_j ⊥ est_j`)]** Routing `1,000` bounded spellcheck queries (`550` LUT, `250` sparse `d_max=2`, `174` `waiOS` Mosaic `tau=4500`, `26` Stage-4) cut KV260 `INA260` `measured_j` `26.58x` gross (`24.49x` net, `0.09%` idle drift PASS) and Thor `INA3221` `measured_j` `16.26x` while avoiding `38.46x` Stage-4 escalations (`est_j` strictly isolated).

