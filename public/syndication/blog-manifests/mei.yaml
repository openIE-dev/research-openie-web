sections:
  - heading: null
    content: |
      *Canonical Primary Source: [https://research.openie.dev/products/mei/](https://research.openie.dev/products/mei/) · Dedicated to the Public Domain (`CC0-1.0`)*

      Metabolic Intelligence gives computers a strict energy budget before they act—from a freezing coin-battery food tag to a hundred-megawatt campus.

  - heading: "Three Plain-Language Takeaways (Zero Acronym Soup)"
    content: |
      1. Give a computer a strict energy budget upfront, and design it to deliver the best verified answer inside that limit.
      2. A food-freshness sensor tag can budget a coin battery for eight years and drop routine chatter in freezing cargo so critical alerts survive.
      3. At the other extreme, a data center can follow power-grid caps by pausing flexible jobs and matching human reading speed.

  - heading: "Everyday Analogy & Why It Matters"
    content: |
      At room temperature, a ten-microwatt sensing schedule lets a coin battery run roughly eight years. Inside a minus-twenty-degree freezer truck, internal battery resistance jumps nearly sixfold to seventy-two ohms, causing unbudgeted wireless bursts to sag below two volts and brown out. Metabolic Intelligence prices both energy spent and decision error before acting.

      On the tag, a lightweight binding classifier needs just one thousand seven hundred twenty-three instructions—about ninety-two nanojoules—while split energy grants protect a dedicated thirty-five-millijoule reserve for critical temperature alarms. Across ten thousand simulated cold-chain wakeups, refusing four hundred ninety routine beacons preserved all forty safety alerts without fail. On a modeled hundred-megawatt campus speaking real grid-signaling protocols, ordered controls plus server sleep held zero minutes over cap.

      Complete two-layer circuit board layouts, component tables, and three-dimensional enclosure models ship openly, with every single figure labeled as datasheet or simulation until physical boards return from fabrication.

  - heading: "Inside the Mechanism & Candid Limits"
    content: |
      Conventional computers treat energy as an accounting bill read only after the work finishes, running full tilt until a coin battery browns out or a power breaker trips. Yet physics shows moving data costs far more than arithmetic, and information value theory proves an observation isn't worth spending joules on unless it can change your next decision. A food-freshness sensor tag inside a minus-twenty-degree cargo container and a hundred-megawatt AI campus during a summer grid peak face the exact same structural challenge. Both operate under hard physical power ceilings where naive bursts crash the system unless routine background work yields smoothly to urgent safety commitments.

      Metabolic Intelligence turns budgeting into four concrete calculations: pick a stored lookup or closed formula whenever it closes the decision, space sensor readings to match how fast freshness drifts, reserve a signed two-phase energy hold before waking the radio, and settle the exact used remainder into non-volatile memory afterward. At data-center scale, streaming chat words three times faster than any person can read shrinks GPU batch sizes and multiplies energy per answer nearly fivefold. Matching output speed to human reading pace and routing routine questions to smaller models roughly doubles useful work per megawatt across modern clusters. Our three-dimensional cutaway inspects the open reference tag package: a thirty-two-by-twenty-four-millimeter two-layer circuit board certified with zero design-rule errors, a low-power Bluetooth microcontroller, a hundred-milliohm inline current sensor, non-volatile receipt memory, and a vented thirty-six-by-twenty-eight-millimeter snap-fit enclosure with lanyard mount.

      When minus-twenty-degree cold raised modeled coin-battery resistance nearly sixfold to seventy-two ohms, two-phase budget gates refused four hundred ninety of five hundred routine beacons so forty out of forty safety alerts survived across two thousand six hundred eighty signed receipts, while node sleep kept every modeled hundred-megawatt campus scenario at zero minutes over cap. Every single number carries its true provenance: our circuit board manufacturing files, bill of materials, component placement tables, and three-dimensional enclosure geometry are open fabrication designs, and our cold-chain battery runs and campus caps are electro-thermal and plant simulations until assembled boards return from fabrication for physical cold-chamber bench metering.

  - heading: "How Energy Was Metered"
    content: |
      - **Acquisition Tier**: Electro-Thermal Model
      - **Disclosure**: Datasheet schedules and cold-chain battery simulations; physical board unmetered.
      - **Evidence Class**: `est_j` (`245.00 µJ (est_j)`)
      - **Meter / Formula**: Analytical CR2032 datasheet & STM32WBA52 + FRAM electro-thermal schedule per JCP wakeup at -20 C

      Energy classes (`measured_j`, `reported_j`, `est_j`, `unmetered`) are strictly partitioned and never summed across boundaries.

