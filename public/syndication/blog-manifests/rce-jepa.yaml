    content: |
      *Canonical Primary Source: [https://research.openie.dev/papers/rce-jepa/](https://research.openie.dev/papers/rce-jepa/) · Dedicated to the Public Domain (`CC0-1.0`)*

      Predict program meaning instead of raw words, let a 49-millijoule checker decide, and cut recurring frontier calls 16.7 times.

  - heading: "Three Plain-Language Takeaways (Zero Acronym Soup)"
    content: |
      1. Instead of guessing raw code word by word, small models predict compact summaries of program meaning.
      2. Any AI model may propose a candidate program, but a fast, strict checker alone decides what passes.
      3. Checking costs over seventeen hundred times less energy than generating, and saved fixes cut big AI calls sixteenfold.

  - heading: "Everyday Analogy & Why It Matters"
    content: |
      Ordinary source files bury real program logic under formatting, imports, and language quirks. Across one hundred eighty-five hand-written programs, Reality Code Engine blueprints shrink description length more than nine times, giving small neural models a compact, noise-free target. First, deterministic rules close one hundred eleven of one hundred fifty-one real-history tasks with zero AI calls.

      Second, tiny six-to-eight-million-parameter meaning predictors and energy scorers solve repairs under half a joule. Third, only remaining open tasks call a frontier model. Given up to five turns of exact checker diagnostics and public library headers, Claude Opus and Sonnet close all forty hard residual tasks with zero contradictions.

      Zero fuzzed bugs slip past the gate, and saved lookup cuts recurring frontier runs sixteen-point-seven times. When an outside stochastic repair step hit two point five percent against its pre-registered two percent ceiling, our harness honestly kept it in observation mode.

  - heading: "Inside the Mechanism & Candid Limits"
    content: |
      For seventy years, computer science has chased one dream: describe what you want and get a working program. Modern language models generate fluent text, yet predicting surface code word by word tangles core meaning with punctuation trivia, burns tens of joules per guess, and quietly invents edge-case bugs. In visual world models, joint embedding predictors plan ahead by predicting compact summaries of a scene instead of rendering every blade of grass. Software needs one decisive addition: because a single unhandled input breaks execution, a fast deterministic checker must inspect every candidate before admission.

      Our World Coding cascade runs strictly from cheapest to dearest. First, exact deterministic rules close one hundred eleven of one hundred fifty-one real-history tasks with zero neural calls. Second, an eight-point-four-million-parameter meaning predictor and six-million-parameter energy scorer propose and rank blueprints in millijoules. Third, frontier models tackle only what remains.

      On Apple M5 Max chip counters, checking one blueprint costs forty-nine millijoules versus eighty-four point two five joules for a local thirty-five-billion-parameter draft—seventeen hundred eighteen times cheaper. Trained on strictly disjoint blueprints, our span-normalized six-million-parameter energy scorer tracks five-step repair depth with ninety-four percent consistency, cutting checker calls over twofold. In this three-dimensional architecture, every learned proposer—whether latent predictor, diffusion sampler, evolutionary search, or cloud reasoner—lives outside the trust boundary. Accepted blueprints enter the verified polyhedron, replay bit-for-bit across ten thousand five hundred six-language streams with zero mutant leaks, and crystallize into instant memory-mapped lookup.

      Across the forty open tasks left by rules alone, up to five rounds of exact checker error feedback with public standard-library signatures lift Claude Opus and Sonnet to forty out of forty with zero contradictions, and Grok to thirty-nine of forty. Crystallized lookup replays in one point seven seven microjoules, cutting two hundred Zipf-distributed arrivals down to twelve frontier calls. Pre-registered thresholds govern without exceptions: when the outside stochastic repair step closed three of one hundred nineteen tasks—two point five percent against a strict two point zero percent cap—it stayed locked in observation mode. Full from-scratch intent synthesis, multi-module energy calibration, and external wall-plug power meters remain open.

  - heading: "How Energy Was Metered"
    content: |
      - **Acquisition Tier**: Chip Energy Counter
      - **Disclosure**: Apple M5 Max and Linux chip counters only; cloud and wall power not measured.
      - **Evidence Class**: `reported_j` (`49.04 mJ (reported_j)`)
      - **Meter / Formula**: Apple M5 Max reported_j checker energy (vs 84.25 J local 35B proposer)

      Energy classes (`measured_j`, `reported_j`, `est_j`, `unmetered`) are strictly partitioned and never summed across boundaries.

