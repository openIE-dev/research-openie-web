<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Stated useful lives for servers and network equipment</title><desc id="d">Dot and arrow chart of stated server lives in years. CoreWeave lengthened from 5 to 6 in 2023, Amazon shortened a subset from 6 to 5 in 2025, Meta set 5.5 in 2025, Alphabet uses 6, Microsoft states 2 to 6 and Oracle 1 to 6.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker></defs><rect x="1" y="1" width="1198" height="518" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40.0" y="58.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a" text-anchor="start">Stated useful lives for servers and network equipment</text>
<text x="40.0" y="92.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Years, from annual reports. Longer lives spread cost over more years and raise reported earnings in the near term.</text>
