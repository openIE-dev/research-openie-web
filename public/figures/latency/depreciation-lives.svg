<text x="40.0" y="490.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Hollow circle = prior estimate; arrow points to the new one. Microsoft and Oracle bars show the stated range (clipped at 3). CoreWeave lenders size loans on the depreciable cost of GPU servers.</text></svg>
