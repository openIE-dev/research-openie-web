<text x="40.0" y="92.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Ratio = baseline cost divided by alternative cost, as each paper reports it. Different tasks, so bars are not comparable across rows.</text>
