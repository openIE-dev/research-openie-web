<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Closed-loop test: upper bounds from documented figures</title><desc id="d">Three horizontal bars. NVIDIA alone supplied up to 24.6 percent of OpenAI March 2026 round. NVIDIA plus Amazon at its stated maximum is up to 65.6 percent. Documented NVIDIA capital to customers is at most 19.5 percent of its fiscal 2026 revenue.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker></defs><rect x="1" y="1" width="1198" height="598" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40.0" y="58.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a" text-anchor="start">Closed-loop test: upper bounds from documented figures</text>
<text x="40.0" y="92.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Share of a node's funding or revenue that could have been supplied by its own counterparties. Bounds, not observations.</text>
<rect x="957.0" y="26" width="203.0" height="34" rx="17" fill="none" stroke="#E69F00" stroke-width="2"/>
<text x="1058.5" y="49.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#E69F00" text-anchor="middle">Model illustration</text>
<text x="406.0" y="186.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="end">OpenAI round: NVIDIA only</text>
<rect x="420.0" y="160.0" width="680.0" height="44.0" rx="0" fill="#f1f5f9" stroke="none" stroke-width="2" opacity="1"/>
<rect x="420.0" y="160.0" width="167.3" height="44.0" rx="0" fill="#0072B2" stroke="none" stroke-width="2" opacity="1"/>
<text x="597.3" y="190.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0072B2" text-anchor="start">24.6%</text>
<text x="420.0" y="232.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">NVIDIA 30 of 122 bn</text>
<text x="406.0" y="316.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="end">OpenAI round: NVIDIA + Amazon max</text>
<rect x="420.0" y="290.0" width="680.0" height="44.0" rx="0" fill="#f1f5f9" stroke="none" stroke-width="2" opacity="1"/>
<rect x="420.0" y="290.0" width="446.1" height="44.0" rx="0" fill="#E69F00" stroke="none" stroke-width="2" opacity="1"/>
<text x="876.1" y="320.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#E69F00" text-anchor="start">65.6%</text>
<text x="420.0" y="362.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">(30 + 50) of 122 bn; Microsoft share undisclosed</text>
<text x="406.0" y="446.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="end">NVIDIA FY2026: directed capital / revenue</text>
<rect x="420.0" y="420.0" width="680.0" height="44.0" rx="0" fill="#f1f5f9" stroke="none" stroke-width="2" opacity="1"/>
<rect x="420.0" y="420.0" width="132.3" height="44.0" rx="0" fill="#009E73" stroke="none" stroke-width="2" opacity="1"/>
<text x="562.3" y="450.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#009E73" text-anchor="start">19.5%</text>
<text x="420.0" y="492.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">(30 + 10 + 2) of 215.9 bn, if all spent on its systems within a year</text>
<line x1="590.0" y1="140.0" x2="590.0" y2="520.0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
