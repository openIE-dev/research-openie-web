<text x="600.0" y="724.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Purchase commitments not drawn: OpenAI to Microsoft Azure $250B (Oct 2025) and to AWS $38B (Nov 2025); Anthropic to Azure $30B (Nov 2025).</text>
