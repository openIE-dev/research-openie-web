<text x="120.0" y="510.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Log scale from 1x to 280x. Price is not cost; the remainder mixes smaller models, algorithms, utilization and margins.</text></svg>
