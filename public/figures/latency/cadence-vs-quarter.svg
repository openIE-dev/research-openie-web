<text x="40.0" y="92.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Model illustration. Quarterly decision dates with T = 0.25 year; readiness at a uniform random phase waits T/2 on average.</text>
