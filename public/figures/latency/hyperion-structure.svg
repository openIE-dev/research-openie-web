<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">One financing structure, as filed: the Hyperion campus venture</title><desc id="d">Diagram: Meta holds 20 percent and Blue Owl funds 80 percent of a joint venture that owns a Louisiana data center campus. Blue Owl paid 7 billion dollars cash at closing; Meta contributed 4.3 billion dollars of assets and received a 2.6 billion dollar distribution.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker></defs><rect x="1" y="1" width="1198" height="518" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40.0" y="58.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a" text-anchor="start">One financing structure, as filed: the Hyperion campus venture</text>
<text x="40.0" y="92.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Meta press release and quarterly report, October 2025. USD billions as printed.</text>
<rect x="1030.5" y="26" width="129.5" height="34" rx="17" fill="none" stroke="#0072B2" stroke-width="2"/>
<text x="1095.2" y="49.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0072B2" text-anchor="middle">Data figure</text>
<rect x="80.0" y="150.0" width="300.0" height="130.0" rx="14" fill="#f8fafc" stroke="#CC79A7" stroke-width="3" opacity="1"/>
<text x="230.0" y="180.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle">Meta</text>
<text x="230.0" y="206.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">20% of the venture</text>
<text x="230.0" y="228.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">contributed 4.3 bn of assets</text>
<text x="230.0" y="250.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">received 2.6 bn distribution</text>
<rect x="80.0" y="330.0" width="300.0" height="130.0" rx="14" fill="#f8fafc" stroke="#8c6d1f" stroke-width="3" opacity="1"/>
<text x="230.0" y="360.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle">Blue Owl funds</text>
<text x="230.0" y="386.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">80% of the venture</text>
<text x="230.0" y="408.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">7.0 bn cash at closing</text>
<text x="230.0" y="430.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">about 27 bn total development cost</text>
<rect x="500.0" y="230.0" width="280.0" height="130.0" rx="14" fill="#f8fafc" stroke="#0072B2" stroke-width="3" opacity="1"/>
<text x="640.0" y="260.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle">Joint venture</text>
<text x="640.0" y="286.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">owns and develops the campus</text>
<text x="640.0" y="308.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">Meta manages construction</text>
<text x="640.0" y="330.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">and operations services</text>
<rect x="900.0" y="230.0" width="240.0" height="130.0" rx="14" fill="#f8fafc" stroke="#009E73" stroke-width="3" opacity="1"/>
<text x="1020.0" y="260.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle">Campus</text>
<text x="1020.0" y="286.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">Richland Parish, Louisiana</text>
<text x="1020.0" y="308.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">buildings, power, cooling,</text>
<text x="1020.0" y="330.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">connectivity</text>
<line x1="380.0" y1="215.0" x2="500.0" y2="280.0" stroke="#CC79A7" stroke-width="3" marker-end="url(#ah)"/>
<line x1="380.0" y1="395.0" x2="500.0" y2="320.0" stroke="#8c6d1f" stroke-width="3" marker-end="url(#ah)"/>
<line x1="780.0" y1="295.0" x2="900.0" y2="295.0" stroke="#0072B2" stroke-width="3" marker-end="url(#ah)"/>
<text x="40.0" y="490.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">The press release gives the split and totals. Rental terms, debt raised at the venture level and guarantees are in other documents; they are not drawn here.</text></svg>
