<text x="40.0" y="92.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">U(x) = −(x − 4)² and surplus U(x) − p·x for three prices (Section 3.10). A constructed toy, not a fit.</text>
