<text x="800.0" y="160.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="start">Aggregate demand is a separate claim</text>
<text x="800.0" y="200.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#0f172a" text-anchor="start">A lower price p moves each maximizer,</text>
<text x="800.0" y="228.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#0f172a" text-anchor="start">and it can open new tasks (rebound).</text>
<text x="800.0" y="256.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#0f172a" text-anchor="start">Each new task still stops at its own</text>
<text x="800.0" y="284.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#0f172a" text-anchor="start">completeness predicate.</text>
<text x="800.0" y="312.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"></text>
<text x="800.0" y="340.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569" text-anchor="start">Task-level satiation holds by definition.</text>
<text x="800.0" y="368.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569" text-anchor="start">Aggregate satiation is not implied,</text>
<text x="800.0" y="396.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569" text-anchor="start">and this paper estimates no rebound.</text>
