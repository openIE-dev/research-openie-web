<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Task satiation is finite at every price</title><desc id="d">Left: model illustration of a bliss point. Value U of x equals minus x minus 4 squared, with surplus U minus p x at prices 0, 2 and 4; the maximizers are 4, 3 and 2 calls, finite at every price. Right: a schematic of aggregate rebound, where lower prices open more tasks, each of which still stops at its own predicate.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker></defs><rect x="1" y="1" width="1198" height="638" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
