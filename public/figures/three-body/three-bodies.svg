<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="t d"><title id="t">Three bodies, three interfaces</title><desc id="d">Diagram of three bodies, theorists, makers and users, drawn as circles at the corners of a triangle. Each edge between two bodies is an interface drawn as a band, labeled with the assumptions that cross it: theorist to maker carries the specification, its units and its operating envelope; maker to user carries the API, the version and the voltage and timing limits; user to theorist carries the actual use, the observed failures and the intent that was never written. Dashed portions of each band mark assumptions that no body writes down or checks.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker></defs><rect x="1" y="1" width="1198" height="858" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40.0" y="58.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a" text-anchor="start">Three bodies, three interfaces</text>
<text x="40.0" y="92.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Each body is coherent alone. Failures originate on the edges, where assumptions cross unwritten.</text>
<rect x="1072.5" y="26" width="87.5" height="34" rx="17" fill="none" stroke="#CC79A7" stroke-width="2"/>
<text x="1116.2" y="49.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#CC79A7" text-anchor="middle">Diagram</text>
<line x1="600.0" y1="230.0" x2="833.8" y2="635.0" stroke="#94a3b8" stroke-width="26"/>
<line x1="681.8" y1="371.8" x2="752.0" y2="493.2" stroke="#D55E00" stroke-width="6" stroke-dasharray="12 9"/>
<text x="799.2" y="397.5" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">specification, units,</text>
<text x="799.2" y="419.5" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">operating envelope</text>
<line x1="833.8" y1="635.0" x2="366.2" y2="635.0" stroke="#94a3b8" stroke-width="26"/>
<line x1="670.1" y1="635.0" x2="529.9" y2="635.0" stroke="#D55E00" stroke-width="6" stroke-dasharray="12 9"/>
<text x="600.0" y="705.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">API, version,</text>
<text x="600.0" y="727.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">voltage and timing limits</text>
<line x1="366.2" y1="635.0" x2="600.0" y2="230.0" stroke="#94a3b8" stroke-width="26"/>
<line x1="448.0" y1="493.2" x2="518.2" y2="371.8" stroke="#D55E00" stroke-width="6" stroke-dasharray="12 9"/>
<text x="400.8" y="397.5" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">actual use, failures,</text>
<text x="400.8" y="419.5" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">intent never written</text>
<circle cx="600.0" cy="230.0" r="72" fill="#0072B2" stroke="#ffffff" stroke-width="4"/>
<text x="600.0" y="232.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">Theorists</text>
<text x="600.0" y="254.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">state what it should do</text>
<circle cx="833.8" cy="635.0" r="72" fill="#E69F00" stroke="#ffffff" stroke-width="4"/>
<text x="833.8" y="637.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">Makers</text>
<text x="833.8" y="659.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">build it</text>
<circle cx="366.2" cy="635.0" r="72" fill="#009E73" stroke="#ffffff" stroke-width="4"/>
<text x="366.2" y="637.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">Users</text>
<text x="366.2" y="659.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">run it</text>
<line x1="70.0" y1="820.0" x2="120.0" y2="820.0" stroke="#D55E00" stroke-width="6" stroke-dasharray="12 9"/>
<text x="132.0" y="826.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#0f172a" text-anchor="start">unexamined assumption: relied on, never written down or checked</text></svg>
