<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="555" viewBox="0 0 1200 555" role="img" aria-labelledby="t3 d3">
  <title id="t3">Frequency Anomaly Atlas across 61 orders of magnitude (AA01 to AA40)</title>
  <desc id="d3">Logarithmic frequency map of 28 single-frequency entries from AA01 to AA40 spanning MOND a0/c (4.0e-19 Hz) and H0 (2.27e-18 Hz) through GW150914 (195 Hz) and Cs-133 Compton frequency (2.99e25 Hz) to the Planck scale (2.95e42 Hz), stratified by OPEN, CONTESTED, and RESOLVED status and colored by SKY versus EARTH domain.</desc>
  <rect x="1" y="1" width="1198" height="553" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="48" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#0f172a">Frequency Anomaly Atlas: 61 decades from a₀/c to ν_Planck</text>
  <text x="40" y="76" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#475569">28 single-frequency entries plotted by log₁₀(ν / Hz) and status; 12 multi-scale entries (AA02, AA10, AA11, AA17–AA19, AA26, AA31, AA32, AA34, AA37, AA38) tabulated.</text>

