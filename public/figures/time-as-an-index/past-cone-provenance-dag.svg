<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t2 d2">
  <title id="t2">Past-light-cone record reconstruction versus speculative timelike signalling</title>
  <desc id="d2">Directed graph contrasting solid allowed causal edges inside the past light cone J-(o) (lossy encoding, stored records, later suggestion, reconstruction, and provenance gate) against the dashed speculative edge from future events outside the past cone tested by F4, F6, F11, F12, and F19.</desc>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#009E73"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0072B2"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D55E00"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="468" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="50" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#0f172a">Allowed past-cone reconstruction (C4) versus timelike reception</text>
  <text x="40" y="78" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Solid edges obey no-signalling and carry measured memory, clock, and astrophysical records; the dashed edge requires 5σ falsifiers.</text>
  <rect x="1048" y="22" width="112" height="32" rx="16" fill="none" stroke="#0072B2" stroke-width="2"/>
  <text x="1104" y="43" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0072B2" text-anchor="middle">Causal DAG</text>

  <!-- Node 1: Past Events -->
  <rect x="40" y="118" width="230" height="106" rx="14" fill="#f8fafc" stroke="#009E73" stroke-width="2.5"/>
  <text x="155" y="146" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="800" fill="#0f172a" text-anchor="middle">Past Events in J⁻(o)</text>
  <text x="155" y="169" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#009E73" font-weight="600" text-anchor="middle">du ≥ 0, dv ≥ 0 (Lean C4)</text>
  <text x="155" y="191" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Sensory episodes, emissions,</text>
  <text x="155" y="209" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">prior commits, clock ticks</text>

  <!-- Node 2: Records in Past Cone -->
  <rect x="336" y="118" width="256" height="106" rx="14" fill="#ecfdf5" stroke="#009E73" stroke-width="2.5"/>
  <text x="464" y="146" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="800" fill="#0f172a" text-anchor="middle">Present Records (E)</text>
  <text x="464" y="169" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#065f46" font-weight="600" text-anchor="middle">Brain traces, SQL logs, starlight</text>
  <text x="464" y="191" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Coarse records lose spread (H3):</text>
  <text x="464" y="209" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">2-bit bin of 4-bit state → 2.000 bits</text>

  <!-- Node 3: Later Suggestion & Priors -->
  <rect x="336" y="256" width="256" height="96" rx="14" fill="#f0f9ff" stroke="#0072B2" stroke-width="2.2"/>
  <text x="464" y="283" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#0f172a" text-anchor="middle">Priors, Schemas &amp; Decoders</text>
  <text x="464" y="305" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#0072B2" font-weight="600" text-anchor="middle">Loftus (32% vs 14%), DRM (40–55%)</text>
  <text x="464" y="325" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">80 ms flash-lag postdiction; preplay;</text>
  <text x="464" y="342" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">language-model BCI completion (F13b)</text>

  <!-- Node 4: Future Event outside Past Cone -->
  <rect x="40" y="294" width="230" height="114" rx="14" fill="#fff7ed" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="155" y="322" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#9a3412" text-anchor="middle">Future Event in I⁺(o)</text>
  <text x="155" y="344" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#D55E00" font-weight="700" text-anchor="middle">Not yet in past light cone</text>
  <text x="155" y="365" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Disjoint from J⁻(o) in Lean M4:</text>
  <text x="155" y="383" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">past_cone_no_future_access</text>
  <text x="155" y="400" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#D55E00" text-anchor="middle">Speculation unless 5σ positive</text>

  <!-- Node 5: Reconstruction -->
  <rect x="664" y="168" width="236" height="124" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="2.6"/>
  <text x="782" y="197" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="800" fill="#0f172a" text-anchor="middle">Reconstruction (R)</text>
  <text x="782" y="220" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Recall, déjà vu, dream, forecast</text>
  <text x="782" y="242" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#0072B2" font-weight="600" text-anchor="middle">Provenance fidelity: I(R; E) / H(R)</text>
  <text x="782" y="262" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Media demand: D = 1 − I(X; C)/H(C)</text>
  <text x="782" y="280" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">Familiarity ≠ future reception</text>

  <!-- Node 6: Provenance Audit & Report -->
  <rect x="954" y="168" width="206" height="124" rx="14" fill="#f8fafc" stroke="#009E73" stroke-width="2.5"/>
  <text x="1057" y="197" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">Provenance Gate</text>
  <text x="1057" y="220" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#009E73" font-weight="700" text-anchor="middle">Pre-hashed ledger</text>
  <text x="1057" y="241" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Relay decay: f^k (0.9¹⁰ = 0.35)</text>
  <text x="1057" y="261" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Speech ~39 bit/s (~2 bit/J)</text>
  <text x="1057" y="280" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">F10, F13b, F15 source checks</text>

  <!-- Solid Allowed Edges -->
  <path d="M270 171 L330 171" stroke="#009E73" stroke-width="2.8" fill="none" marker-end="url(#ag)"/>
  <text x="302" y="161" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#065f46" text-anchor="middle">lossy</text>

  <path d="M592 178 L658 206" stroke="#009E73" stroke-width="2.8" fill="none" marker-end="url(#ag)"/>
  <path d="M592 296 L658 254" stroke="#0072B2" stroke-width="2.6" fill="none" marker-end="url(#ab)"/>
  <path d="M900 230 L948 230" stroke="#009E73" stroke-width="2.8" fill="none" marker-end="url(#ag)"/>

  <!-- Dashed Speculative Signalling Edge -->
  <path d="M270 382 C 470 412, 620 388, 742 298" stroke="#D55E00" stroke-width="2.8" stroke-dasharray="8 6" fill="none" marker-end="url(#ar)"/>
  <rect x="330" y="378" width="432" height="32" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="546" y="399" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#9a3412" text-anchor="middle">Timelike signalling claim → tested at 5σ by F4, F6, F11, F12, F19</text>

  <text x="600" y="444" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" text-anchor="middle" font-style="italic">Established for solid edges (allowed past-cone queries); Speculation for the dashed edge (zero Grade A/B survivors in TA001–TA081).</text>
</svg>
