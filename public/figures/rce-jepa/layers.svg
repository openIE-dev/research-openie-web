00" fill="#E69F00" text-anchor="start">SCIENCE</text><text x="780" y="192" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#0f172a" text-anchor="start">"Laws of Programming"</text><text x="780" y="226" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="start">How are correct programs built and</text><text x="780" y="246" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="start">transformed?</text><text x="780" y="278" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Hoare et al. 1987, Dijkstra, Bird</text><text x="780" y="368" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Formalized today</text><rect x="910" y="356" width="170" height="14" rx="7" fill="#e2e8f0"/><rect x="910" y="356" width="85.0" height="14" rx="7" fill="#E69F00"/><rect x="1120" y="130" width="340" height="270" rx="14" fill="#D55E00" fill-opacity="0.10" stroke="#D55E00" stroke-width="2"/><text x="1140" y="162" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#D55E00" text-anchor="start">ART</text><text x="1140" y="192" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#0f172a" text-anchor="start">"Laws of Coding"</text><text x="1140" y="226" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="start">How is working code produced in</text><text x="1140" y="246" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="start">practice?</text><text x="1140" y="278" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Brooks, Lehman, Hindle et al.,</text><text x="1140" y="297" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">benchmarks; AI coding today</text><text x="1140" y="368" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Formalized today</text><rect x="1270" y="356" width="170" height="14" rx="7" fill="#e2e8f0"/><rect x="1270" y="356" width="25.5" height="14" rx="7" fill="#D55E00"/><path d="M 120 470 Q 750 400 1380 470" fill="none" stroke="#CC79A7" stroke-width="4" stroke-dasharray="10 6"/><line x1="220" y1="400" x2="220" y2="458" stroke="#CC79A7" stroke-width="2"/><line x1="580" y1="400" x2="580" y2="440" stroke="#CC79A7" stroke-width="2"/><line x1="940" y1="400" x2="940" y2="440" stroke="#CC79A7" stroke-width="2"/><line x1="1300" y1="400" x2="1300" y2="458" stroke="#CC79A7" stroke-width="2"/><text x="750" y="500" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#9c3d7a" text-anchor="middle">RCE-JEPA: a bridge carrying evidence between layers, not a merger</text><text x="40" y="540" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Bars are a qualitative judgement explained in the accompanying table, not a measurement.</text></svg>