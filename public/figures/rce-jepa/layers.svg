<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560"><title>Four layers of law, from theory to art</title><rect x="1" y="1" width="1498" height="558" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="56" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a" text-anchor="start">Four layers of law, from theory to art</text><text x="40" y="88" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Distinct layers, never interchangeable; RCE-JEPA bridges them without merging them</text><rect x="40" y="130" width="340" height="270" rx="14" fill="#0072B2" fill-opacity="0.10" stroke="#0072B2" stroke-width="2"/><text x="60" y="162" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0072B2" text-anchor="start">THEORY</text><text x="60" y="192" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#0f172a" text-anchor="start">"Laws of Computation"</text><text x="60" y="226" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="start">What can be computed, at what</text><text x="60" y="246" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="start">information and energy cost?</text><text x="60" y="278" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Shannon, Landauer, Bennett, Turing,</text><text x="60" y="297" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Rice, Lloyd</text><text x="60" y="368" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size