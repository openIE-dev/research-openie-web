<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760"><title>RCE-JEPA architecture</title><rect x="1" y="1" width="1498" height="758" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><text x="40" y="56" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a" text-anchor="start">RCE-JEPA: the model steers, the engine renders</text><text x="40" y="88" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Learned and untrusted inside the dashed region; public code or specified design outside it (see the RCE paper). Only the gate admits.</text><rect x="30" y="112" width="1010" height="560" rx="18" fill="none" stroke="#E69F00" stroke-width="2.5" stroke-dasharray="12 8"/><text x="50" y="140" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#B07500" text-anchor="start">LEARNED, UNTRUSTED (proposers)</text><rect x="60" y="160" width="300" height="120" rx="12" fill="#E69F00" fill-opacity="0.12" stroke="#E69F00" stroke-width="2"/><text x="210.0" y="188" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">Intent encoder</text><text x="210.0" y="212" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">sigma(iota): required traces,</text><text x="210.0" y="233" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">contracts, tests, text  -&gt;  z_iota</text><rect x="400" y="160" width="300" height="120" rx="12" fill="#E69F00" fill-opacity="0.12" stroke="#E69F00" stroke-width="2"/><text x="550.0" y="188" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">Proposer (inverse model)</text><text x="550.0" y="212" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">(z_iota, z_f) -&gt; typed Form edit</text><text x="550.0" y="233" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">fill hole, add rule, change guard</text><rect x="740" y="160" width="280" height="120" rx="12" fill="#0072B2" fill-opacity="0.12" stroke="#0072B2" stroke-width="2"/><text x="880.0" y="188" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">Exact rollout delta</text><text x="880.0" y="212" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">reference checker, no model:</text><text x="880.0" y="233" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">trace tau(f) on example events</text><rect x="400" y="330" width="300" height="140" rx="12" fill="#E69F00" fill-opacity="0.12" stroke="#E69F00" stroke-width="2"/><text x="550.0" y="358" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">Form encoder + energy</text><text x="550.0" y="382" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">(f, tau(f)) -&gt; z_f</text><text x="550.0" y="403" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">E = alpha V + beta d + gamma C</text><text x="550.0" y="424" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">alpha, beta, gamma calibrated per run</text><rect x="60" y="330" width="300" height="140" rx="12" fill="#E69F00" fill-opacity="0.12" stroke="#E69F00" stroke-width="2"/><text x="210.0" y="358" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">Tree search</text><text x="210.0" y="382" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">beam or tree over edits,</text><text x="210.0" y="403" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">exact delta at every node,</text><text x="210.0" y="424" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">not CEM (space is discrete)</text><rect x="740" y="330" width="280" height="140" rx="12" fill="#CC79A7" fill-opacity="0.12" stroke="#CC79A7" stroke-width="2"/><text x="880.0" y="358" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">Decision head</text><text x="880.0" y="382" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">small decision model trained</text><text x="880.0" y="403" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">on gate receipts: Choice per</text><text x="880.0" y="424" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">hole, calibrated p_i; a proposer</text><text x="535" y="515" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B07500" text-anchor="middle">Every box in this region may be wrong. None of them can admit a program.</text><text x="535" y="540" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B07500" text-anchor="middle">Security never depends on any model, hosted or local.</text><rect x="1090" y="160" width="370" height="200" rx="12" fill="#009E73" fill-opacity="0.12" stroke="#009E73" stroke-width="2"/><text x="1275.0" y="188" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">GATE (engine design)</text><text x="1275.0" y="212" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">contract check, shadow replay,</text><text x="1275.0" y="233" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">schema, Kani certificate,</text><text x="1275.0" y="254" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Z3 proof for rewrites</text><text x="1275.0" y="275" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">accept -&gt; promote -&gt; receipt (est_j)</text><text x="1275.0" y="296" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">requires change -&gt; named rule</text><rect x="1090" y="400" width="370" height="170" rx="12" fill="#009E73" fill-opacity="0.12" stroke="#009E73" stroke-width="2"/><text x="1275.0" y="428" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">Checker and engine</text><text x="1275.0" y="452" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">replay bit for bit (T3)</text><text x="1275.0" y="473" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">projections: Rust, Python,</text><text x="1275.0" y="494" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">JavaScript, Scala (T9-L)</text><text x="1275.0" y="515" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">design: promoted handler closes the shape</text><line x1="360" y1="220" x2="398" y2="220" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><line x1="700" y1="220" x2="738" y2="220" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><line x1="880" y1="280" x2="700" y2="360" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><line x1="400" y1="400" x2="362" y2="400" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><line x1="700" y1="400" x2="738" y2="400" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><line x1="1020" y1="400" x2="1088" y2="330" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><line x1="1275" y1="360" x2="1275" y2="398" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><path d="M 1090 345 C 1060 660, 260 660, 210 474" fill="none" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="640" y="615" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#D55E00" text-anchor="middle">requires change: the rule fed back, search re-ranks</text><text x="40" y="712" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Abbreviations: delta, transition function; tau(f), trace of Form f; sigma(iota), specification of intent iota; V, checker violations; d, trace distance; C, predicted cost in joules;</text><text x="40" y="734" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">CEM, cross-entropy method; Kani, a Rust model checker; Z3, an SMT solver; est_j, estimated joules. A design diagram, not data.</text></svg>