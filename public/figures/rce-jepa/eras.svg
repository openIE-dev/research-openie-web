<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640"><title>Five eras toward "Laws of Computation"</title><rect x="1" y="1" width="1498" height="638" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="56" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a" text-anchor="start">Five eras on the road toward "Laws of Computation"</text><text x="40" y="88" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Each era did what its hardware, information theory and applied computer science allowed</text><text x="30" y="202" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0072B2" text-anchor="start">Hardware</text><text x="30" y="346" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#009E73" text-anchor="start">Information</text><text x="30" y="366" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#009E73" text-anchor="start">theory</text><text x="30" y="490" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#E69F00" text-anchor="start">Applied computer</text><text x="30" y="510" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#E69F00" text-anchor="start">science</text><text x="331.0" y="126" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">1940s to 1950s</text><rect x="230" y="140" width="202" height="130" rx="10" fill="#0072B2" fill-opacity="0.10" stroke="#0072B2" stroke-width="1.5"/><text x="240" y="164" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">Memory "usually too</text><text x="240" y="183" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">small"; FORTRAN on IBM</text><text x="240" y="202" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">704: 47 statements in 6</text><text x="240" y="221" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">min to ~1000 instructions</text><rect x="230" y="284" width="202" height="130" rx="10" fill="#009E73" fill-opacity="0.10" stroke="#009E73" stroke-width="1.5"/><text x="240" y="308" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">Shannon 1948: information</text><text x="240" y="327" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">in bits</text><rect x="230" y="428" width="202" height="130" rx="10" fill="#E69F00" fill-opacity="0.10" stroke="#E69F00" stroke-width="1.5"/><text x="240" y="452" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">First optimizing compiler</text><text x="240" y="471" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">(FORTRAN, 1957)</text><text x="545.0" y="126" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">1960s</text><rect x="444" y="140" width="202" height="130" rx="10" fill="#0072B2" fill-opacity="0.10" stroke="#0072B2" stroke-width="1.5"/><text x="454" y="164" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">IBM System/360 (1964):</text><text x="454" y="183" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">memory x16, performance</text><text x="454" y="202" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">x50 across one</text><text x="454" y="221" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">instruction set</text><rect x="444" y="284" width="202" height="130" rx="10" fill="#009E73" fill-opacity="0.10" stroke="#009E73" stroke-width="1.5"/><text x="454" y="308" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">Landauer 1961: erasure</text><text x="454" y="327" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">costs heat; Kolmogorov,</text><text x="454" y="346" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">Solomonoff, Chaitin:</text><text x="454" y="365" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">shortest description</text><rect x="444" y="428" width="202" height="130" rx="10" fill="#E69F00" fill-opacity="0.10" stroke="#E69F00" stroke-width="1.5"/><text x="454" y="452" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">Hoare 1969: axiomatic</text><text x="454" y="471" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">proof of programs</text><text x="759.0" y="126" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">1970s to 1980s</text><rect x="658" y="140" width="202" height="130" rx="10" fill="#0072B2" fill-opacity="0.10" stroke="#0072B2" stroke-width="1.5"/><text x="668" y="164" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">Alto 1973: 4,096 x 32-bit</text><text x="668" y="183" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">control store; VAX 1977:</text><text x="668" y="202" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">5,120 x 96-bit; density</text><text x="668" y="221" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">doubling every 2 years</text><rect x="658" y="284" width="202" height="130" rx="10" fill="#009E73" fill-opacity="0.10" stroke="#009E73" stroke-width="1.5"/><text x="668" y="308" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">Bennett 1973: reversible</text><text x="668" y="327" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">computing; Bennett and</text><text x="668" y="346" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">Landauer 1985</text><rect x="658" y="428" width="202" height="130" rx="10" fill="#E69F00" fill-opacity="0.10" stroke="#E69F00" stroke-width="1.5"/><text x="668" y="452" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">Lehman 1980; Brooks 1986;</text><text x="668" y="471" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">Hoare et al. 1987: ~100</text><text x="668" y="490" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">algebraic laws</text><text x="973.0" y="126" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">1990s to 2000s</text><rect x="872" y="140" width="202" height="130" rx="10" fill="#0072B2" fill-opacity="0.10" stroke="#0072B2" stroke-width="1.5"/><text x="882" y="164" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">~50% yearly performance</text><text x="882" y="183" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">growth 1986 to ~2002 from</text><text x="882" y="202" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">parallel instructions</text><rect x="872" y="284" width="202" height="130" rx="10" fill="#009E73" fill-opacity="0.10" stroke="#009E73" stroke-width="1.5"/><text x="882" y="308" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">Lloyd 2000: energy limits</text><text x="882" y="327" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">speed</text><rect x="872" y="428" width="202" height="130" rx="10" fill="#E69F00" fill-opacity="0.10" stroke="#E69F00" stroke-width="1.5"/><text x="882" y="452" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">McKee 1995; CompCert and</text><text x="882" y="471" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">seL4 machine-checked</text><text x="1187.0" y="126" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">2010s to today</text><rect x="1086" y="140" width="202" height="130" rx="10" fill="#0072B2" fill-opacity="0.10" stroke="#0072B2" stroke-width="1.5"/><text x="1096" y="164" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">Dennard scaling gone by</text><text x="1096" y="183" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">2012; cache access ~200x</text><text x="1096" y="202" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">a 32-bit add; ~3 to 4 J</text><text x="1096" y="221" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">per language-model token</text><rect x="1086" y="284" width="202" height="130" rx="10" fill="#009E73" fill-opacity="0.10" stroke="#009E73" stroke-width="1.5"/><text x="1096" y="308" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">Wolpert 2019; prediction</text><text x="1096" y="327" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">= compression; Carette et</text><text x="1096" y="346" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">al. 2022</text><rect x="1086" y="428" width="202" height="130" rx="10" fill="#E69F00" fill-opacity="0.10" stroke="#E69F00" stroke-width="1.5"/><text x="1096" y="452" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">Learned proposers + exact</text><text x="1096" y="471" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">checkers</text><rect x="1300" y="140" width="170" height="418" rx="12" fill="#CC79A7" fill-opacity="0.12" stroke="#CC79A7" stroke-width="2" stroke-dasharray="6 5"/><text x="1385.0" y="200" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#9c3d7a" text-anchor="middle">Open question</text><text x="1385.0" y="226" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#9c3d7a" text-anchor="middle"></text><text x="1385.0" y="252" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#9c3d7a" text-anchor="middle">a unified</text><text x="1385.0" y="278" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#9c3d7a" text-anchor="middle">"Laws of</text><text x="1385.0" y="304" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#9c3d7a" text-anchor="middle">Computation"</text><text x="1385.0" y="330" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#9c3d7a" text-anchor="middle"></text><text x="1385.0" y="356" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#9c3d7a" text-anchor="middle">not yet</text><text x="1385.0" y="382" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#9c3d7a" text-anchor="middle">formalized</text><text x="40" y="616" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Sources: Dijkstra EWD 340; Backus et al. 1957; Hennessy and Patterson 2019; Samsi et al. 2023; others as cited in the table. A historical diagram, not data.</text></svg>