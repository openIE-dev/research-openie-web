  <text x="52.0" y="144.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.2" font-weight="800" fill="#f59e0b">C1 · Autoregressive LLMs</text>
  <text x="52.0" y="172.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.8" font-weight="400" fill="#10b981">+ Broad NL parsing &amp; open synthesis</text>
