  <rect x="44.0" y="584.0" width="568.0" height="62.0" rx="8.0" fill="#0f172a" stroke="#a78bfa" stroke-width="1.30"/>
  <text x="58.0" y="605.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="800" fill="#a78bfa">KEY ASYMMETRY &amp; SOVEREIGNTY BOUNDARY (CTA-T29 TO CTA-T31):</text>
  <text x="58.0" y="623.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#e2e8f0">• Readout reaches ~15-19 bit/s (BM07/08), while multi-brain BrainNet is ~0.05 bit/s.</text>
  <text x="58.0" y="640.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#10b981">• Every future write-in bridge MUST enforce local hardware opt-in g_i(s_i, m) = 1.</text>
  <rect x="644.0" y="82.0" width="528.0" height="578.0" rx="12.0" fill="#111827" stroke="#f59e0b" stroke-width="1.50"/>
  <text x="660.0" y="107.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.0" font-weight="800" fill="#f8fafc">B · Paracrine &amp; EV Translational Funnel (EV01–EV16)</text>
  <text x="660.0" y="125.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" fill="#94a3b8">16 primary studies audited vs. mandatory clinical efficacy gap (CA-H8)</text>
  <rect x="662.0" y="146.0" width="492.0" height="116.0" rx="9.0" fill="#0f172a" stroke="#10b981" stroke-width="1.60"/>
  <text x="908.0" y="167.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.0" font-weight="800" fill="#10b981" text-anchor="middle">STAGE 1 · 16 / 16 REPLICATED PRECLINICAL STUDIES [E]</text>
  <text x="676.0" y="188.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" fill="#e2e8f0">• Renal &amp; Senescence (EV01,07,08,13-15): RNase-sensitive mRNA;</text>
  <text x="676.0" y="206.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" fill="#cbd5e1">  eNAMPT/GSTM2/PGC-1a (+12.4% aged mouse median lifespan).</text>
  <text x="676.0" y="224.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" fill="#e2e8f0">• Stroke, Status Epilepticus &amp; TBI (EV02-04,11,16): MSC/hNSC EVs.</text>
  <text x="676.0" y="242.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" fill="#e2e8f0">• AD, PD &amp; Autism Models (EV05,06,09,10,12): 3xTg/5XFAD/Shank3B.</text>
  <line x1="908.0" y1="262.0" x2="908.0" y2="280.0" stroke="#10b981" stroke-width="2.20" marker-end="url(#arr-amber)"/>
  <rect x="696.0" y="282.0" width="424.0" height="92.0" rx="9.0" fill="#0f172a" stroke="#22d3ee" stroke-width="1.60"/>
  <text x="908.0" y="303.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.0" font-weight="800" fill="#22d3ee" text-anchor="middle">STAGE 2 · 1 / 16 LARGE-ANIMAL GYRENCEPHALIC BRIDGE [E]</text>
  <text x="710.0" y="324.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" fill="#e2e8f0">• Porcine Permanent MCAO Stroke (EV04 · Webb et al. 2018):</text>
  <text x="710.0" y="342.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" fill="#cbd5e1">  IV hNSC-EVs reduced lesion volume &amp; white-matter loss.</text>
  <text x="710.0" y="360.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" fill="#e2e8f0">• Remaining 15 / 16 studies are murine/rat/in-vitro models.</text>
  <line x1="908.0" y1="374.0" x2="908.0" y2="392.0" stroke="#22d3ee" stroke-width="2.20" marker-end="url(#arr-amber)"/>
  <rect x="724.0" y="394.0" width="368.0" height="112.0" rx="9.0" fill="#0f172a" stroke="#f59e0b" stroke-width="1.60"/>
  <text x="908.0" y="415.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.0" font-weight="800" fill="#f59e0b" text-anchor="middle">STAGE 3 · TRANSLATIONAL &amp; SAFETY BOTTLENECKS</text>
  <text x="738.0" y="436.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" fill="#e2e8f0">• Nasal Anatomy: Human olfactory area ~3-5% vs ~50% rodent.</text>
  <text x="738.0" y="454.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" fill="#e2e8f0">• Systemic Clearance: Heavy hepatic/splenic trapping of IV EVs.</text>
  <text x="738.0" y="472.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" fill="#e2e8f0">• Oncogenic &amp; Lot Risk: ESC miR-290 proliferation; donor variance.</text>
  <text x="738.0" y="490.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" fill="#e2e8f0">• Model Gap: Acute 6-OHDA / APP != sporadic human PD / AD.</text>
  <line x1="908.0" y1="506.0" x2="908.0" y2="524.0" stroke="#f59e0b" stroke-width="2.20" marker-end="url(#arr-amber)"/>
  <rect x="752.0" y="526.0" width="312.0" height="116.0" rx="9.0" fill="#0f172a" stroke="#f43f5e" stroke-width="1.60"/>
  <text x="908.0" y="547.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.0" font-weight="800" fill="#f43f5e" text-anchor="middle">STAGE 4 · 0 / 16 PHASE-III HUMAN CNS APPROVALS [S]</text>
  <text x="766.0" y="568.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" fill="#e2e8f0">• 0 approved human neurodegenerative or cognitive EV therapies.</text>
  <text x="766.0" y="586.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" fill="#e2e8f0">• CA-H8 Kill Gate: Double-blind GMP Phase-II/III human RCT</text>
  <text x="766.0" y="604.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" fill="#cbd5e1">  must beat sham intranasal vehicle at p &lt; 0.01.</text>
  <text x="766.0" y="622.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" fill="#e2e8f0">• Zero clinical claims made in this study.</text>
  <rect x="28.0" y="672.0" width="1144.0" height="32.0" rx="8.0" fill="#111827" stroke="#334155" stroke-width="1.20"/>
  <text x="600.0" y="692.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.0" font-weight="400" fill="#cbd5e1" text-anchor="middle">Catalog Sources: bci-sensing-modulation-matrix.csv (BM01-BM18) &amp; secretome-ev-evidence-ledger.csv (EV01-EV16) · Verified via Europe PMC DOIs/PMIDs</text>
