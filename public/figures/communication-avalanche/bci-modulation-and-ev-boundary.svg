<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="cta-bci-ev-t cta-bci-ev-d">
  <title id="cta-bci-ev-t">Neural Interface Bandwidth vs. Invasiveness (BM01-BM18) and Paracrine EV Translational Funnel (EV01-EV16)</title>
  <desc id="cta-bci-ev-d">Left panel plots all 18 neural and paracrine modalities (BM01-BM18) on log10 bandwidth (bit/s) versus invasiveness, highlighting the 10-39 bit/s overt human speech ceiling, ~15-19 bit/s intracortical speech readout, ~0.05 bit/s BrainNet, closed-loop ICMS/aDBS, and the CTA-T29 Local Consent Gate boundary. Right panel contrasts 16/16 replicated preclinical rodent/porcine/in vitro EV rescue studies (EV01-EV16) against 0 Phase-III human CNS approvals (CA-H8).</desc>
