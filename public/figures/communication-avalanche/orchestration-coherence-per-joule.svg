<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="t-cta d-cta">
  <title id="t-cta">Event-Driven Thresholded Orchestration vs Clocked Polling and 60-Task Code-Repair Coherence per Joule</title>
  <desc id="d-cta">Two-panel dark-theme hardware benchmark figure on 13th Gen Intel Core i9-13900H (Linux RAPL reported_j, board_metered = false, measured_j = None). Left panel (CTA-E1): 16-node orchestration DAG package-0 reported_j across 1%, 5%, and 20% bursty duty cycles comparing zero-clock eventfd threshold firing against 10 Hz, 100 Hz, and 1,000 Hz clocked polling, plus compiled Rust BLAKE3 and Ed25519 verification microjoules per edge. Right panel (CTA-E2 and CTA-E3): 60-task Python code-repair verified pass rate, false-commit rate, API token/USD cost, and Coherence per Joule across Det-Only, Monolithic-LLM, Unattested-4-Agent, and CTA-Orchestrator, alongside 0/200 Byzantine fault containment.</desc>
