  <text x="632.0" y="269.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="800" fill="#f59e0b">STAGE 2 · HARDWARE-PROFILED SSP NICHE ROUTER</text>
  <text x="632.0" y="291.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.8" font-weight="400" fill="#e2e8f0">Reads cost_lut.json (RAPL reported_j or Thor INA238 measured_j)</text>
  <text x="632.0" y="311.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.7" font-weight="400" fill="#cbd5e1">Bellman-Ford + Johnson Dijkstra min-cost flow in 2.11 us</text>
  <line x1="857.0" y1="328.0" x2="857.0" y2="346.0" stroke="#10b981" stroke-width="2.20" marker-end="url(#arr-emerald)"/>
  <rect x="618.0" y="348.0" width="478.0" height="82.0" rx="9.0" fill="#0f172a" stroke="#a78bfa" stroke-width="1.60"/>
  <text x="632.0" y="371.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="800" fill="#a78bfa">STAGE 3 · THRESHOLDED NOVELTY ESCALATION (eventfd)</text>
  <text x="632.0" y="393.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.8" font-weight="400" fill="#e2e8f0">Blocks at 0 CPU cycles while V_u &lt; theta_u; zero polling tax</text>
  <text x="632.0" y="413.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.7" font-weight="400" fill="#cbd5e1">Wakes Tier-3 LLM strictly on deterministic miss (21/60 calls)</text>
  <line x1="857.0" y1="430.0" x2="857.0" y2="448.0" stroke="#10b981" stroke-width="2.20" marker-end="url(#arr-emerald)"/>
  <rect x="618.0" y="450.0" width="478.0" height="82.0" rx="9.0" fill="#0f172a" stroke="#10b981" stroke-width="1.60"/>
  <text x="632.0" y="473.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="800" fill="#10b981">STAGE 4 · VERIFIED DOWNWARD CRYSTALLIZER</text>
  <text x="632.0" y="495.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.8" font-weight="400" fill="#e2e8f0">Sound Verifier Gate enforces 0.00% false commits (CTA-T3..T6)</text>
  <text x="632.0" y="515.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.7" font-weight="400" fill="#cbd5e1">Compiles: Tier 3 (15 J) -&gt; Tier 2 (15 mJ) -&gt; Tier 1 (1.77 uJ) -&gt; LUT6 (~12 pJ)</text>
