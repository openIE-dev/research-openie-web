  <rect x="618.0" y="552.0" width="478.0" height="82.0" rx="9.0" fill="#0f172a" stroke="#22d3ee" stroke-width="1.60"/>
  <text x="632.0" y="575.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="800" fill="#22d3ee">STAGE 5 · IMMUTABLE JOULE LEDGER &amp; AUTO-PRUNING</text>
  <text x="632.0" y="597.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.8" font-weight="400" fill="#e2e8f0">Hash-chained receipts per firing; prunes dominated high-J edges</text>
  <text x="632.0" y="617.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.7" font-weight="400" fill="#cbd5e1">Updates SSP cost weights automatically as hit rate p_hit rises</text>
