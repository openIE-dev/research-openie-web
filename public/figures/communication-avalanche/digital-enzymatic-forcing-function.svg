  <text x="30.0" y="60.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.0" font-weight="500" fill="#94a3b8">Slashing multi-paradigm handoff activation energy from &gt;15 J prose chat to &lt;1 mJ attested IR without consuming the enzyme</text>
