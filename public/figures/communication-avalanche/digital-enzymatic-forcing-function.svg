  <text x="46.0" y="108.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.2" font-weight="800" fill="#f8fafc">A · Computational Activation Barrier (Log10 Joules / Handoff)</text>
  <text x="46.0" y="127.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#94a3b8">Analogous to biological enzyme catalysis: catalyst lowers E^ddagger &amp; exits intact</text>
