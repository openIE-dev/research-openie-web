<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="cta-enz-force-t cta-enz-force-d">
  <title id="cta-enz-force-t">Catalytic Reaction-Coordinate and 5-Stage Closed-Loop Forcing-Function Blueprint</title>
  <desc id="cta-enz-force-d">Left panel plots the computational activation energy barrier E^ddagger of unattested natural-language multi-agent handoff (&gt;15 J to 110 J/task, 3.71x prompt bloat, 13.3% false commits) versus a Digital Enzyme (Phi_IR + BLAKE3/Ed25519 + deterministic verifier) slashing Delta E^ddagger to &lt;1 mJ (26-37 us, 0% drift, enzyme unconsumed). Right panel details the 5-stage closed-loop forcing-function blueprint.</desc>
