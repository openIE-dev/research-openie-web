  <text x="618.0" y="658.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.8" font-weight="400" fill="#10b981">Amortization threshold N* = ceil(E_synth / (c_hi - c_lo)) proved in Lean (CTA-T23)</text>
