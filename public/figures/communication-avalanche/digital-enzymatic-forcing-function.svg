  <text x="327.0" y="147.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.6" font-weight="700" fill="#f43f5e" text-anchor="middle">Unattested 4-Agent Chat: ~110 J/task (3.71x bloat, 13.3% bad)</text>
  <path d="M 126.0 312.4 C 222.0 312.4, 262.0 194.8, 332.0 194.8 C 402.0 194.8, 452.0 237.8, 530.0 237.8" fill="none" stroke="#f59e0b" stroke-width="2.20" stroke-dasharray="3,3"/>
