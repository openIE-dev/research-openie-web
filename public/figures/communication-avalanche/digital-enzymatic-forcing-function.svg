  <text x="252.0" y="279.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.6" font-weight="400" fill="#22d3ee">&gt;15,000x (&lt;1 mJ gate)</text>
  <text x="327.0" y="398.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.6" font-weight="700" fill="#22d3ee" text-anchor="middle">Digital Enzyme Gate: 643-926 uJ (26-37 us)</text>
  <text x="526.0" y="489.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="800" fill="#10b981" text-anchor="end">Crystallized Case: 1.77 uJ (0% drift)</text>
  <text x="102.0" y="528.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.8" font-weight="400" fill="#cbd5e1">Raw Arrival (s_i)</text>
  <text x="326.0" y="528.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.8" font-weight="400" fill="#cbd5e1" text-anchor="middle">Transition State (Gate)</text>
  <text x="554.0" y="528.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.8" font-weight="400" fill="#10b981" text-anchor="end">Locked Skill</text>
  <rect x="46.0" y="542.0" width="520.0" height="112.0" rx="9.0" fill="#0f172a" stroke="#22d3ee" stroke-width="1.40"/>
  <text x="62.0" y="565.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="800" fill="#22d3ee">THREE DEFINING PROPERTIES OF A DIGITAL ENZYME E = (Phi_IR, Verify, Gate):</text>
  <text x="62.0" y="587.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.0" font-weight="400" fill="#e2e8f0">1. Substrate Specificity: Canonical schema strips prose bloat (3.71x -&gt; 1.00x).</text>
  <text x="62.0" y="608.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.0" font-weight="400" fill="#e2e8f0">2. Sub-Millijoule Barrier: Rust BLAKE3 + Ed25519 verifies in 26-37 us (&lt;1 mJ).</text>
  <text x="62.0" y="629.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.0" font-weight="400" fill="#10b981">3. Unconsumed Reusability: Zero weight mutation; locks gains into O(1) store.</text>
  <rect x="600.0" y="82.0" width="572.0" height="590.0" rx="12.0" fill="#111827" stroke="#10b981" stroke-width="1.60"/>
  <text x="618.0" y="108.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.2" font-weight="800" fill="#f8fafc">B · Five-Stage Closed-Loop Forcing-Function Blueprint</text>
  <text x="618.0" y="127.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#94a3b8">Architectural pipeline forcing monotonic Coherence-per-Joule (CpJ) escalation</text>
  <rect x="618.0" y="144.0" width="478.0" height="82.0" rx="9.0" fill="#0f172a" stroke="#22d3ee" stroke-width="1.60"/>
  <text x="632.0" y="167.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="800" fill="#22d3ee">STAGE 1 · CANONICAL TYPED ENVELOPE (Phi_IR)</text>
  <text x="632.0" y="189.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.8" font-weight="400" fill="#e2e8f0">256-bit BLAKE3 digest + 64-byte Ed25519 signature (RFC 8032)</text>
  <text x="632.0" y="209.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.7" font-weight="400" fill="#cbd5e1">Eliminates chat avalanche; rejects bit-flips in 0.19 us</text>
