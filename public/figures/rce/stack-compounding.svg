<text x="700.0" y="332.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="start">No correction</text>
<rect x="700.0" y="440.0" width="271.4" height="54.0" rx="6" fill="#009E73" stroke="none" stroke-width="2" opacity="1"/>
<text x="981.4" y="476.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a" text-anchor="start">15</text>
<text x="700.0" y="432.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="start">One correction at the sinks</text>
<text x="700.0" y="530.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Both reach zero escalations in the last round;</text>
<text x="700.0" y="550.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">no promotion was refused.</text></svg>
