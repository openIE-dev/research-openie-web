<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="t d"><title id="t">Code is reused at every scale</title><desc id="d">Five small panels, each with its own unit. Lopes et al. 2017: of 428 million files in 4.5 million non-fork GitHub projects, 85 million are unique, with the quotation that 70% of the code on GitHub consists of clones of previously created files. Gabel and Su 2010: between 50% and 100% of each project is redundant at about one line, against 420 million lines. The Stack: near-deduplication removes 54.7% of v1, 6.4 TB to 2.9 TB, and 52.4% of v2, 67.5 TB to 32.1 TB. Software Heritage: 30.3 billion unique file contents from 448 million origins, archive counters read 13 October 2026, each stored once by the hash of its bytes. PAR found several common fix patterns in more than 60,000 human patches; TBar fixes 43 Defects4J bugs correctly in the standard pipeline and 74 of 101 with perfect fault localization.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker></defs><rect x="1" y="1" width="1198" height="1008" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40.0" y="58.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a" text-anchor="start">Code is reused at every scale</text>
<text x="40.0" y="92.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Five measures from Section 7. Each panel has its own unit and scale; the panels are not comparable with each other.</text>
