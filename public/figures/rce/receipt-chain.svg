<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="t d"><title id="t">The log is a hash chain; every cost carries a basis</title><desc id="d">Diagram. Top: three log entries, seq 0, 1 and 2, each with fields seq, event, prev_hash, state_hash and hash. The first prev_hash is 64 zeros; each later prev_hash equals the previous entry's hash, drawn as arrows. state_hash is the SHA-256 of the state after the step; hash is the SHA-256 of the canonical JSON of event, prev_hash, seq and state_hash. Bottom: a gear receipt with fields gear, gear_name, est_j, basis, candidates_tried and resolved, beside the rule that est_j is required and is either a finite non-negative number or null, with null allowed only when basis says unpriced; unpriced cost is never read as zero joules.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker></defs><rect x="1" y="1" width="1198" height="858" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40.0" y="58.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a" text-anchor="start">The log is a hash chain; every cost carries a basis</text>
<text x="40.0" y="92.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Entries of D (spec 6.1) and the receipt rule for est_j (Section 4.4). Hash labels are symbolic.</text>
