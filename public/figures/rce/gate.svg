<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d"><title id="t">The gate on proposed equivalences</title><desc id="d">Two rows of squares, one square per proposed equivalence. Row one, a local 1.5-billion-parameter coding model, Qwen2.5-Coder-1.5B under llama.cpp: 16 squares, 3 filled green for equivalences the check admitted by randomized trials and a Z3 proof, 13 outlined for rejected. Row two, a deterministic proposer of 87 familiar identities: 87 squares, 77 arithmetic and 10 structural, 9 filled green, all structural; 78 outlined for rejected: all 77 arithmetic identities, for fault order, non-numbers or overflow, and one structural rewrite that would drop an escalating prefix.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker></defs><rect x="1" y="1" width="1198" height="538" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
