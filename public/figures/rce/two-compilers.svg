<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="t d"><title id="t">One Form, five targets, one reference trace</title><desc id="d">Diagram in two lanes. Top lane, the engine compiler rce form: a .rce handler spec and its fit are lowered, saturated and extracted by est_j into the Form IR, which is projected to five targets: a Rust crate, WASM, Python, XState v5 and SCXML run by SCION. All five print the reference trace byte for byte on 529 events in tests/form_targets.rs; this is claim T9-F, established by differential testing. Bottom lane, the language command rce emit: a checked .rce module is emitted as form JSON, Rust, Python or JavaScript; claim T9-L, proved for the Rust emitter on a core as a verified translation into MiniRust, and tested for Python and JavaScript.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker></defs><rect x="1" y="1" width="1198" height="838" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
