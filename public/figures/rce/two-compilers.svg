<text x="40.0" y="92.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Two compilers, two claims: rce form projects the Form IR (T9-F); rce emit translates a checked module (T9-L).</text>
