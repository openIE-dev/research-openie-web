<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Models propose, checkers decide</title><desc id="d">Diagram. Four gear boxes stacked from cheapest to costliest: G0 Lookup, a shared handler library keyed by SHA-256 shape hash; G1 Rules, guarded repair templates and schema-derived validators; G2 Synthesis, enumeration over the handler grammar, solvers and e-graphs; G3 to G5 Models, a typed decision model, a local small model and a remote model, marked as proposers only. Each gear sends its candidate to one gate with five checks: replay of recorded inputs, a shadow run with a coverage bound, an output schema check, the Kani proof certificate, and for rewrites a randomized check then a Z3 proof. A pass promotes the candidate to a stored handler, which feeds G0; a fail is logged with its counterexample and escalates to the next gear.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker></defs><rect x="1" y="1" width="1198" height="798" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40.0" y="58.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a" text-anchor="start">Models propose, checkers decide</text>
<text x="40.0" y="92.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Gears run in order of cost; the first candidate that passes the gate closes the task (Sections 4.2 and 4.3).</text>
<rect x="1072.5" y="26" width="87.5" height="34" rx="17" fill="none" stroke="#CC79A7" stroke-width="2"/>
