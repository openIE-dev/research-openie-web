<circle cx="540.0" cy="316.0" r="12" fill="#D55E00" stroke="#ffffff" stroke-width="2"/>
<text x="540.0" y="321.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
<text x="562.0" y="321.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">shadow run on fresh samples with</text>
<text x="562.0" y="343.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">a coverage bound (rule of three)</text>
<circle cx="540.0" cy="392.0" r="12" fill="#D55E00" stroke="#ffffff" stroke-width="2"/>
