<circle cx="540.0" cy="544.0" r="12" fill="#D55E00" stroke="#ffffff" stroke-width="2"/>
<text x="540.0" y="549.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
<text x="562.0" y="549.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">rewrites:</text>
<text x="562.0" y="571.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">randomized check, then a Z3 proof</text>
<rect x="930.0" y="160.0" width="230.0" height="190.0" rx="14" fill="#f8fafc" stroke="#009E73" stroke-width="3" opacity="1"/>
<text x="1045.0" y="190.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle">Pass: promote</text>
<text x="1045.0" y="216.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">stored as a handler;</text>
<text x="1045.0" y="238.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">the same shape</text>
<text x="1045.0" y="260.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">closes at G0</text>
<text x="1045.0" y="282.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">next time</text>
<rect x="930.0" y="410.0" width="230.0" height="190.0" rx="14" fill="#f8fafc" stroke="#D55E00" stroke-width="3" opacity="1"/>
<text x="1045.0" y="440.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle">Fail: reject</text>
<text x="1045.0" y="466.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">logged with its</text>
<text x="1045.0" y="488.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">counterexample;</text>
<text x="1045.0" y="510.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">escalate to the</text>
<text x="1045.0" y="532.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">next gear</text>
<line x1="852.0" y1="255.0" x2="924.0" y2="255.0" stroke="#009E73" stroke-width="3" marker-end="url(#ah)"/>
