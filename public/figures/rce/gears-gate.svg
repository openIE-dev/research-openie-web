<rect x="560.0" y="108.0" width="220.0" height="24.0" rx="0" fill="#ffffff" stroke="none" stroke-width="2" opacity="1"/>
<text x="670.0" y="126.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#009E73" text-anchor="middle">promotion feeds G0</text>
<text x="40.0" y="700.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Every promotion, refusal, deferral and install is an entry in the SHA-256 chained log, with a receipt (Figure 8).</text>
<text x="40.0" y="724.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">The Kani harnesses and the SMT encoding are fixed: promotion changes handlers and rewrites, never the checker.</text>
<text x="40.0" y="748.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Gear names in the engine: G0 library, G1 rules, G2 synthesis, G3 system-one, G4 local-model, G5 remote.</text></svg>
