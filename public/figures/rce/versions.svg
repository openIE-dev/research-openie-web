<text x="60.0" y="306.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start"></text>
<text x="60.0" y="330.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start">no budgets</text>
<line x1="60.0" y1="392.0" x2="370.0" y2="392.0" stroke="#e2e8f0" stroke-width="2"/>
