<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="t d"><title id="t">Version gates: the first line fixes the meaning</title><desc id="d">Diagram. Three version cards. Version 0.5, no declaration: the language of sections 2 to 10, with no budgets. Version 0.6, first line # rce-version: 0.6: version 0.5 plus Appendix C, where 23 words become keywords and par, for par, with budget, workgroups, LVars, sessions and supervisors are added; a standard library method costs c_call, 4. Version 0.7, first line # rce-version: 0.7: the syntax and rules of 0.6 with one difference, method cost 4 plus work(m, n, k). Errata apply to every version. Below, the per-call-site rule: a 0.6 module under a budget calls a function in a 0.7 module that sorts 8 elements; the sort is charged 4 plus 24 because it is written in the 0.7 module, so the call costs 24 more than the same call into a 0.6 function.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker></defs><rect x="1" y="1" width="1198" height="918" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40.0" y="58.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a" text-anchor="start">Version gates: the first line fixes the meaning</text>
<text x="40.0" y="92.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Each module declares its version (spec 2.7, C.15). A change of meaning gets a new version, never a silent change.</text>
