<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="t d"><title id="t">Verification at a glance</title><desc id="d">Summary of verification results. Engine tests at commit 1eb5f02: 589 pass, 0 fail, 2 ignored; make check prints 596 because it runs 7 proof tests twice. Lean 4: 2,192 theorems over 31 files with no sorry and only the axioms propext, Quot.sound and Classical.choice. WebAssembly checker: 401 of 401 checks. Bar chart of Kani 0.67.0: 10 of 10 kernel harnesses verified with 0 of 7,425 checks failed; checks per harness range from 216 for position_is_name_independent to 962 for handler_core_validate. Specification check: LALR(1) tables with 0 conflicts for the core grammar (932 states) and the grammar with Appendix C (1,110 states); 51 of 51 valid examples accepted, 12 of 12 syntax rejects and 64 of 64 ill-typed or inadmissible programs refused.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker></defs><rect x="1" y="1" width="1198" height="948" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
