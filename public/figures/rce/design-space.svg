<line x1="600.0" y1="470.0" x2="837.8" y2="392.7" stroke="#94a3b8" stroke-width="2"/>
<text x="875.8" y="380.4" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Determinism</text>
<text x="875.8" y="402.4" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">outward: entropy resolved once</text>
<line x1="600.0" y1="470.0" x2="746.9" y2="672.3" stroke="#94a3b8" stroke-width="2"/>
