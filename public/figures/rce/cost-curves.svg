<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Method cost by receiver size: version 0.6 and 0.7</title><desc id="d">Line chart on log scales of the budget cost of one standard library method call against receiver size n from 1 to 1,024, with no argument. Under version 0.6 every method costs 4 at every size. Under version 0.7 linear methods on text, lists and maps cost 4 plus n, reaching 1,028 at n = 1,024, and sort costs 4 plus n times the ceiling of log base 2 of n, reaching 10,244 at n = 1,024. Constant-class methods cost 4 in both versions. A marker shows that sorting 8 elements costs 28 in version 0.7, 24 more than in 0.6.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker></defs><rect x="1" y="1" width="1198" height="758" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
