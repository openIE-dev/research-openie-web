<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t-tel d-tel">
  <title id="t-tel">Satiation Benchmark five-level telemetry attribution (L0 to L4 by A1 to N) and seven-step raw-first sum-check pipeline</title>
  <desc id="d-tel">Left panel maps physical and logical telemetry levels L0 wall, L1 platform, L2 package/SoC, L3 process/cgroup, and L4 logical conversation counts onto attribution labels A1 exclusive rail, A2 dedicated boundary, B temporal phase, C proportional CPU/GPU share, D OS-modelled, P provider-attested, and N not_available. Right panel shows the 7-step raw-first discipline ending in the Step 6 pre/post drift gate (Falsifier 6) and Step 7 sum check that drops broken derived splits while preserving raw A2 window joules.</desc>
  <defs>
    <marker id="t-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/>
    </marker>
    <marker id="t-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#009E73"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="598" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="38" y="48" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#0f172a">Five-level telemetry attribution (L0–L4 × A1–N) &amp; seven-step sum check</text>
  <text x="38" y="75" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#475569">Channels carry explicit physical boundaries and attribution labels; derived splits and drifted baselines never overwrite raw counters.</text>
  <rect x="1074" y="22" width="88" height="32" rx="16" fill="none" stroke="#CC79A7" stroke-width="2"/>
  <text x="1118" y="43" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#CC79A7" text-anchor="middle">Diagram</text>

  <!-- LEFT PANEL: L0..L4 x A1..N -->
  <rect x="32" y="96" width="572" height="452" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="52" y="122" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0f172a">A · Measurement Boundaries (L0–L4) &amp; Attribution Labels (A1–N)</text>

  <!-- L0 -->
  <rect x="48" y="136" width="540" height="56" rx="9" fill="#ffffff" stroke="#009E73" stroke-width="2"/>
  <text x="64" y="158" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a">L0 wall · AC at the plug</text>
  <text x="64" y="178" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">Shelly apower / aenergy + sync pulse · Whole machine incl. PSU loss (~1 s)</text>
  <rect x="492" y="148" width="82" height="28" rx="14" fill="#ecfdf5" stroke="#009E73" stroke-width="1.6"/>
  <text x="533" y="166" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#009E73" text-anchor="middle">Label A2</text>

  <!-- L1 -->
  <rect x="48" y="200" width="540" height="56" rx="9" fill="#ffffff" stroke="#009E73" stroke-width="2"/>
  <text x="64" y="222" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a">L1 platform · Board DC input</text>
  <text x="64" y="242" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">Thor INA238 carrier · Mac sys_power · Linux RAPL psys · Whole host DC side</text>
  <rect x="492" y="212" width="82" height="28" rx="14" fill="#ecfdf5" stroke="#009E73" stroke-width="1.6"/>
  <text x="533" y="230" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#009E73" text-anchor="middle">Label A2</text>

  <!-- L2 -->
  <rect x="48" y="264" width="540" height="68" rx="9" fill="#ffffff" stroke="#0072B2" stroke-width="2.2"/>
  <text x="64" y="286" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a">L2 package / SoC · CPU package, GPU &amp; SoC rails</text>
  <text x="64" y="305" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">RAPL pkg · rootless macmon IOReport · Thor INA3221 · amdgpu hwmon · NVML mJ</text>
  <text x="64" y="322" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#0072B2">Primary SUT raw window figure on quiesced host (A2) or exclusive accelerator rail (A1)</text>
  <rect x="454" y="274" width="120" height="28" rx="14" fill="#eff6ff" stroke="#0072B2" stroke-width="1.6"/>
  <text x="514" y="292" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#0072B2" text-anchor="middle">A1 · A2 · B · C</text>

  <!-- L3 -->
  <rect x="48" y="340" width="540" height="60" rx="9" fill="#ffffff" stroke="#D55E00" stroke-width="2"/>
  <text x="64" y="362" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a">L3 process / cgroup · One process tree</text>
  <text x="64" y="381" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">Linux cgroup v2 cpu.stat / memory.peak / io.stat · macOS proc_pid_rusage ri_energy_nj</text>
  <text x="64" y="395" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#D55E00">Activity shares (not physical rail joules); kernel per-PID energy estimate on Apple Silicon</text>
  <rect x="492" y="352" width="82" height="28" rx="14" fill="#fff7ed" stroke="#D55E00" stroke-width="1.6"/>
  <text x="533" y="370" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#D55E00" text-anchor="middle">Label D</text>

  <!-- L4 -->
  <rect x="48" y="408" width="540" height="58" rx="9" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="64" y="430" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a">L4 logical · The conversation &amp; proxy ledger</text>
  <text x="64" y="450" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">satb-proxy token counts &amp; timings · turns · tool calls · elisions (exact on every SUT)</text>
  <rect x="476" y="420" width="98" height="28" rx="14" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.6"/>
  <text x="525" y="438" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#0f172a" text-anchor="middle">Exact (L4)</text>

  <!-- Closed API rule box -->
  <rect x="48" y="476" width="540" height="58" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="64" y="497" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#991b1b">Closed-API Server Boundary: Strictly P (provider-attested) or N (not_available)</text>
  <text x="64" y="516" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#7f1d1d">Provider sustainability fleet medians (0.24 Wh, 0.34 Wh, 1.14 gCO2e) never enter a receipt.</text>

  <!-- RIGHT PANEL: 7-Step Pipeline -->
  <rect x="620" y="96" width="548" height="452" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="640" y="122" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0f172a">B · Seven-Step Raw-First Counter &amp; Sum-Check Pipeline</text>

  <!-- Vertical spine -->
  <line x1="658" y1="154" x2="658" y2="514" stroke="#94a3b8" stroke-width="2.2"/>

  <!-- Step 1 -->
  <circle cx="658" cy="154" r="13" fill="#0f172a"/>
  <text x="658" y="158" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="682" y="151" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Read cumulative counters at every event boundary</text>
  <text x="682" y="168" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">attempt.start/close, model_call, tool_call + 100 ms reference tick (rootless).</text>

  <!-- Step 2 -->
  <circle cx="658" cy="212" r="13" fill="#009E73"/>
  <text x="658" y="216" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="682" y="209" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Write raw channels first (primary A2 window joules)</text>
  <text x="682" y="226" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">Start/end values, wraps, read count; &lt; 10 sensor periods marked below_resolution.</text>

  <!-- Step 3 -->
  <circle cx="658" cy="270" r="13" fill="#0072B2"/>
  <text x="658" y="274" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="682" y="267" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Split sequential phases (label B)</text>
  <text x="682" y="284" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">Lane B runs model calls and tools strictly in sequence; overlapping Lane O drops to C or N.</text>

  <!-- Step 4 -->
  <circle cx="658" cy="328" r="13" fill="#0072B2"/>
  <text x="658" y="332" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
  <text x="682" y="325" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Isolate engine-resident power during tool phases</text>
  <text x="682" y="342" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">Recorded in engine_resident_during_tools; assigned neither to model nor to tool.</text>

  <!-- Step 5 -->
  <circle cx="658" cy="386" r="13" fill="#D55E00"/>
  <text x="658" y="390" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
  <text x="682" y="383" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Split by proportion (C, Kepler) only where partitions overlap</text>
  <text x="682" y="400" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">ΔCPU_partition / ΔCPU_total; memory-bound DRAM traffic, DVFS, and I/O wait break C.</text>

  <!-- Step 6 -->
  <circle cx="658" cy="444" r="13" fill="#D55E00"/>
  <text x="658" y="448" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">6</text>
  <text x="682" y="441" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Store floor, resident &amp; observer baselines as derived channels</text>
  <text x="682" y="458" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">Falsifier 6: pre/post idle drift &gt; 5.0% invalidates derived net subtraction; raw joules stay valid.</text>

  <!-- Step 7 -->
  <circle cx="658" cy="504" r="13" fill="#009E73"/>
  <text x="658" y="508" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">7</text>
  <text x="682" y="501" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#009E73">Run the sum check (Falsifier 2)</text>
  <text x="682" y="518" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0f172a">Derived parts must sum to raw Δ within 1 sensor quantum, else derived splits are dropped.</text>

  <text x="600" y="575" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" text-anchor="middle" font-style="italic">Attribution pipeline diagram. On Apple M5 Max, local counters are reported_j (IOReport L1/L2 and rusage L3); measured_j = None.</text>
</svg>
