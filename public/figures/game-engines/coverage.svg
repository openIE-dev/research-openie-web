<g font-size="13" text-anchor="middle" font-weight="bold">
<text x="330" y="70">Behavior</text><text x="430" y="70">Scene</text><text x="530" y="70">Shader</text><text x="630" y="70">Exec. order</text><text x="730" y="70">Multi-target</text><text x="830" y="70">Replay log</text><text x="930" y="70">Cross-layer</text>
</g>
