<text x="20" y="148">Naga IR (WGSL/SPIR-V/MSL)</text>
<text x="20" y="188">WGSL / WESL</text>
<text x="20" y="228">glTF 2.0</text>
<text x="20" y="268">OpenUSD</text>
<text x="20" y="308">BSN (Bevy proposal)</text>
<text x="20" y="348">SCXML / XState</text>
<text x="20" y="388">VGDL (GVGAI)</text>
<text x="20" y="428">GameRule DSL</text>
<text x="20" y="468">nAIVE (YAML+Lua+Slang)</text>
<text x="20" y="508">SpacetimeDB module</text>
</g>
