<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" font-family="Helvetica,Arial,sans-serif">
  <rect width="1040" height="650" fill="#ffffff"/>

  <!-- Title -->
  <text x="520" y="31" font-size="19.5" text-anchor="middle" font-weight="bold" fill="#0f172a">
    Empirical Determinism Boundary: 3-OS × 3-ISA Exact State (GE-H1/H2) vs 3-API GPU Tolerance (GE-H3)
  </text>
  <text x="520" y="51" font-size="12.2" text-anchor="middle" fill="#475569">
    Executed across 6 hosts (arm64 macOS, aarch64 Linux, AMD/Intel x86_64 Linux, Intel x86_64 Windows 11) and 8 GPU×API endpoints (DirectX 12, Metal, Vulkan)
  </text>

  <!-- Left Panel: Exact Zone -->
  <rect x="24" y="70" width="464" height="520" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="256" y="95" font-size="15.5" text-anchor="middle" font-weight="bold" fill="#14532d">
    EXACT ZONE · Simulation State S (Upstream of λ)
  </text>
  <text x="256" y="113" font-size="11.8" text-anchor="middle" fill="#166534">
    Criterion: SHA-256(s_t^A) == SHA-256(s_t^B) at every tick (0 bit drift permitted)
  </text>

  <!-- GE-H1 Box -->
  <rect x="40" y="127" width="432" height="218" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="52" y="149" font-size="13.2" font-weight="bold" fill="#14532d">
    GE-H1 · Q32.32 64-Bit Integer Physics (100,000 Ticks)
  </text>
  <rect x="338" y="134" width="124" height="22" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="400" y="149" font-size="10.8" font-weight="bold" text-anchor="middle" fill="#15803d">0 / 25,500 MISMATCH</text>

  <g font-size="11.2" fill="#1e293b">
    <text x="52" y="172" font-weight="bold">• Apple M5 Max &amp; M3 Ultra (arm64, macOS 27.2.1):</text>
    <text x="64" y="187" fill="#334155">7 cells (Rust, Clang, Wasm32, JS, Py) · L3: 0.073–13.60 J · MATCH</text>

    <text x="52" y="208" font-weight="bold">• AMD Zen 5 &amp; Intel i9-13900H (x86_64, Linux 7.0):</text>
    <text x="64" y="223" fill="#334155">12 cells (Rust, Clang, GCC, Wasm, JS, Py) · L2: 1.89–181.9 J · MATCH</text>

    <text x="52" y="244" font-weight="bold">• NVIDIA Jetson Thor (Armv9-A aarch64, Linux 6.8 CPU):</text>
    <text x="64" y="259" fill="#334155">6 cells · 1,000/1,000 stride-100 SHA-256 checkpoints · MATCH</text>

    <text x="52" y="280" font-weight="bold">• Intel Core i7-1165G7 (Tiger Lake x86_64, Windows 11 26300):</text>
    <text x="64" y="295" fill="#334155">5 cells (Rust PE, MSVC cl.exe, Wasm, JS, Py) · 1,000/1,000 · MATCH</text>
  </g>
  <text x="256" y="334" font-size="10.8" font-family="Courier,monospace" text-anchor="middle" fill="#0f766e" font-weight="bold">
    H(100,000) = 82e404df6475d64dbfeaaa0f6cda8092... (30/30 cells · 3 OSs)
  </text>

  <!-- GE-H2 Box -->
  <rect x="40" y="357" width="432" height="219" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="52" y="378" font-size="13.2" font-weight="bold" fill="#92400e">
    GE-H2 · 3-OS &amp; Cross-ISA IEEE-754 f64 Controls (25,000 Ticks)
  </text>

  <g font-size="11.1" fill="#1e293b">
    <rect x="52" y="389" width="408" height="34" rx="5" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="62" y="403" font-weight="bold" fill="#065f46">Pinned f64/f32 algebraic + sqrt (/fp:strict, -ffp-contract=off):</text>
    <text x="62" y="417" fill="#047857">0-ULP identical across Win11, macOS &amp; Linux (&gt; 25,000 ticks)</text>

    <rect x="52" y="429" width="408" height="42" rx="5" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="62" y="444" font-weight="bold" fill="#991b1b">3-OS std::sin/cos Triangle (Win11 UCRT · Apple libm · GNU glibc):</text>
    <text x="62" y="459" fill="#b91c1c">UCRT vs glibc t = 10 (10,392) · UCRT vs libm t = 37 · libm vs glibc t = 10</text>

    <rect x="52" y="477" width="408" height="42" rx="5" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="62" y="492" font-weight="bold" fill="#991b1b">Compiler &amp; Cross-ISA FMA (NO -ffast-math / algebraic only):</text>
    <text x="62" y="507" fill="#b91c1c">MSVC /fp:precise vs Clang FMA t = 192 · x86_64 vs arm64 FMA t = 406</text>

    <rect x="52" y="525" width="408" height="40" rx="5" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="62" y="540" font-weight="bold" fill="#991b1b">V8 Math.sin (Win11 == Linux x86_64; vs arm64 t = 66 → 10,093)</text>
    <text x="62" y="555" fill="#b91c1c">Binary32 step-down (f64 vs f32 strict): t_div = 1 → Gameplay t = 1,370</text>
  </g>

  <!-- Center Determinism Boundary -->
  <line x1="510" y1="66" x2="510" y2="596" stroke="#dc2626" stroke-width="3" stroke-dasharray="9,6"/>
  <rect x="490" y="296" width="40" height="72" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="510" y="324" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">λ(s_t)</text>
  <text x="510" y="341" font-size="10" text-anchor="middle" fill="#991b1b">1-way</text>
  <text x="510" y="356" font-size="10" text-anchor="middle" fill="#991b1b">view</text>

  <!-- Right Panel: Tolerance Zone -->
  <rect x="532" y="70" width="484" height="520" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="774" y="95" font-size="15.5" text-anchor="middle" font-weight="bold" fill="#7c2d12">
    TOLERANCE ZONE · GE-H3 3-API wgpu (DX12 · Metal · Vulkan)
  </text>
  <text x="774" y="113" font-size="11.8" text-anchor="middle" fill="#9a3412">
    512×512 RGBA8Unorm · 28/28 hardware GPU×API pairs (112/112 frames) pass gate
  </text>

  <!-- Chart Area -->
  <rect x="548" y="127" width="452" height="354" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="560" y="147" font-size="12.2" font-weight="bold" fill="#0f172a">
    Minimum Pairwise PSNR across Ticks 0, 250, 1k, 10k (Same-GPU &amp; Cross-Vendor)
  </text>
  <text x="560" y="163" font-size="10.8" fill="#475569">
    Scale: 30 to 110 dB · Gate: PSNR &gt; 40 dB, SSIM &gt; 0.999, p(|Δ| &gt; 8) ≤ 0.1%
  </text>

  <!-- X-axis scale: x=736 is 30 dB, 2.2 px/dB: 40=758, 60=802, 80=846, 100=890, 110=912 -->
  <line x1="736" y1="175" x2="736" y2="452" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="802" y1="175" x2="802" y2="452" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="846" y1="175" x2="846" y2="452" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="890" y1="175" x2="890" y2="452" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="912" y1="175" x2="912" y2="452" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 40 dB Gate Line -->
  <line x1="758" y1="172" x2="758" y2="456" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="762" y="470" font-size="10" font-weight="bold" text-anchor="middle" fill="#dc2626">40 Gate</text>
  <text x="736" y="470" font-size="9.8" text-anchor="middle" fill="#64748b">30</text>
  <text x="802" y="470" font-size="9.8" text-anchor="middle" fill="#64748b">60</text>
  <text x="846" y="470" font-size="9.8" text-anchor="middle" fill="#64748b">80</text>
  <text x="890" y="470" font-size="9.8" text-anchor="middle" fill="#64748b">100</text>
  <text x="918" y="470" font-size="9.8" text-anchor="middle" fill="#64748b">110 dB</text>

  <!-- Bars: width = (PSNR - 30) * 2.2 -->
  <g font-size="10.6" fill="#1e293b">
    <!-- Row 1: RTX 2060 Same GPU DX12 vs Vulkan: 108.34 dB -> w = 172.3 -->
    <text x="730" y="192" text-anchor="end" font-weight="bold" fill="#5b21b6">RTX 2060: DX12 vs Vulkan</text>
    <rect x="736" y="180" width="172.3" height="16" rx="3" fill="#7c3aed"/>
    <text x="913" y="192" font-size="10.2" font-weight="bold" fill="#5b21b6">108.3 dB (1 px)</text>

    <!-- Row 2: Win11 WARP vs Apple Metal: 98.79 dB -> w = 151.3 -->
    <text x="730" y="222" text-anchor="end" font-weight="bold">Win11 WARP vs Apple Metal</text>
    <rect x="736" y="210" width="151.3" height="16" rx="3" fill="#0d9488"/>
    <text x="892" y="222" font-size="10.2" font-weight="bold" fill="#0f766e">98.8 dB (Δ≤1)</text>

    <!-- Row 3: Iris Xe Same GPU DX12 vs Vulkan: 79.52 dB -> w = 108.9 -->
    <text x="730" y="252" text-anchor="end" font-weight="bold" fill="#5b21b6">Iris Xe: DX12 vs Vulkan</text>
    <rect x="736" y="240" width="108.9" height="16" rx="3" fill="#7c3aed"/>
    <text x="850" y="252" font-size="10.2" font-weight="bold" fill="#5b21b6">79.5 dB (0.28%)</text>

    <!-- Row 4: Apple Metal vs Iris Xe DX12: 72.06 dB -> w = 92.5 -->
    <text x="730" y="282" text-anchor="end" font-weight="bold">Apple Metal vs Iris Xe DX12</text>
    <rect x="736" y="270" width="92.5" height="16" rx="3" fill="#0d9488"/>
    <text x="834" y="282" font-size="10.2" font-weight="bold" fill="#0f766e">72.1 dB (1.3%)</text>

    <!-- Row 5: AMD RADV vs Apple Metal: 69.09 dB -> w = 86.0 -->
    <text x="730" y="312" text-anchor="end" font-weight="bold">AMD RADV vs Apple Metal</text>
    <rect x="736" y="300" width="86.0" height="16" rx="3" fill="#0d9488"/>
    <text x="827" y="312" font-size="10.2" font-weight="bold" fill="#0f766e">69.1 dB (3.1%)</text>

    <!-- Row 6: AMD RADV vs RTX 2060 DX12: 65.64 dB -> w = 78.4 -->
    <text x="730" y="342" text-anchor="end" font-weight="bold">AMD RADV vs RTX 2060 DX12</text>
    <rect x="736" y="330" width="78.4" height="16" rx="3" fill="#0284c7"/>
    <text x="819" y="342" font-size="10.2" font-weight="bold" fill="#0369a1">65.6 dB (6.6%)</text>

    <!-- Row 7: RTX 2060 vs Iris Xe (Win11 DX12): 64.79 dB -> w = 76.5 -->
    <text x="730" y="372" text-anchor="end" font-weight="bold">RTX 2060 vs Iris Xe (DX12)</text>
    <rect x="736" y="360" width="76.5" height="16" rx="3" fill="#0284c7"/>
    <text x="818" y="372" font-size="10.2" font-weight="bold" fill="#0369a1">64.8 dB (8.3%)</text>

    <!-- Row 8: Apple Metal vs RTX 2060 DX12: 64.16 dB -> w = 75.2 -->
    <text x="730" y="402" text-anchor="end" font-weight="bold">Apple Metal vs RTX 2060 DX12</text>
    <rect x="736" y="390" width="75.2" height="16" rx="3" fill="#0284c7"/>
    <text x="816" y="402" font-size="10.2" font-weight="bold" fill="#0369a1">64.2 dB (9.3%)</text>

    <!-- Row 9: GPUs vs CPU Q16.16 Ref (4 hosts): 59.13 dB -> w = 64.1 -->
    <text x="730" y="434" text-anchor="end" fill="#475569">GPUs vs CPU Q16.16 (4 OS/ISA)</text>
    <rect x="736" y="422" width="64.1" height="16" rx="3" fill="#d97706"/>
    <text x="805" y="434" font-size="10.2" font-weight="bold" fill="#b45309">59.1–60.6 dB (Δ≤2)</text>
  </g>

  <!-- Summary Card Bottom Right -->
  <rect x="548" y="492" width="452" height="84" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="560" y="512" font-size="11.8" font-weight="bold" fill="#78350f">
    Why Exact Pixel Hashing Fails Yet 3-API Tolerance Holds:
  </text>
  <text x="560" y="530" font-size="10.9" fill="#451a03">
    • Same GPU across DX12 (HLSL/DXIL) vs Vulkan (SPIR-V) flips 1 LSB via shader lowering.
  </text>
  <text x="560" y="547" font-size="10.9" fill="#451a03">
    • All 28/28 GPU×API pairs keep Δ_max ≤ 2/255, SSIM ≥ 0.99983, 0 outliers &gt; ε = 8.
  </text>
  <text x="560" y="564" font-size="10.9" fill="#065f46" font-weight="bold">
    • RTX 2060 (Win11 DX12) == RTX 4050 (Linux Vulkan) 4/4 exact · CPU Q16.16 4/4 hosts exact.
  </text>

  <!-- Footer -->
  <rect x="24" y="604" width="992" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="520" y="624" font-size="11.3" text-anchor="middle" fill="#334155">
    Energy &amp; telemetry discipline: measured_j = None, board_metered = false · macOS L3 ri_energy_nj, Linux L2 RAPL reported_j &amp; Win32 L3 cycles kept separate.
  </text>
</svg>
