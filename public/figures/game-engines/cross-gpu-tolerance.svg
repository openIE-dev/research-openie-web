<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="630" viewBox="0 0 1040 630" font-family="Helvetica,Arial,sans-serif">
  <rect width="1040" height="630" fill="#ffffff"/>

  <!-- Title -->
  <text x="520" y="32" font-size="20" text-anchor="middle" font-weight="bold" fill="#0f172a">
    Empirical Determinism Boundary: Multi-ISA Exact State (GE-H1/H2) vs Cross-GPU Bounded Tolerance (GE-H3)
  </text>
  <text x="520" y="52" font-size="12.5" text-anchor="middle" fill="#475569">
    Executed across 5 hosts (arm64 macOS, aarch64 Linux, AMD Zen 5 &amp; Intel Raptor Lake x86_64 Linux) and 4 GPU architectures (Metal &amp; Vulkan)
  </text>

  <!-- Left Panel: Exact Zone -->
  <rect x="24" y="72" width="464" height="500" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="256" y="98" font-size="15.5" text-anchor="middle" font-weight="bold" fill="#14532d">
    EXACT ZONE · Simulation State S (Upstream of λ)
  </text>
  <text x="256" y="116" font-size="12" text-anchor="middle" fill="#166534">
    Criterion: SHA-256(s_t^A) == SHA-256(s_t^B) at every tick (0 bit drift permitted)
  </text>

  <!-- GE-H1 Box -->
  <rect x="40" y="132" width="432" height="206" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="54" y="154" font-size="13.5" font-weight="bold" fill="#14532d">
    GE-H1 · Q32.32 64-Bit Integer Physics (100,000 Ticks)
  </text>
  <rect x="342" y="139" width="118" height="22" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="401" y="154" font-size="11" font-weight="bold" text-anchor="middle" fill="#15803d">0 / 20,500 MISMATCH</text>

  <g font-size="11.5" fill="#1e293b">
    <text x="54" y="178" font-weight="bold">• Apple M5 Max &amp; M3 Ultra (arm64, macOS 27.2.1):</text>
    <text x="66" y="194" fill="#334155">Rust, C++20, Wasm32, JS BigInt, Python · L3: 0.073–13.60 J · MATCH</text>

    <text x="54" y="216" font-weight="bold">• AMD Ryzen AI Max+ 395 (Zen 5 x86_64, Linux 7.0):</text>
    <text x="66" y="232" fill="#334155">6 targets (Rust, Clang, GCC, Wasm, JS, Py) · 1,000/1,000 · MATCH</text>

    <text x="54" y="254" font-weight="bold">• Intel Core i9-13900H (Raptor Lake x86_64, Linux 7.0):</text>
    <text x="66" y="270" fill="#334155">6 targets · L2 Intel RAPL pkg: 1.89 J (Clang) to 149.5 J (Py) · MATCH</text>

    <text x="54" y="292" font-weight="bold">• NVIDIA Jetson Thor (Armv9-A aarch64, Linux 6.8 CPU):</text>
    <text x="66" y="308" fill="#334155">6 targets · 1,000/1,000 stride-100 SHA-256 checkpoints · MATCH</text>
  </g>
  <text x="256" y="328" font-size="11" font-family="Courier,monospace" text-anchor="middle" fill="#0f766e" font-weight="bold">
    H(100,000) = 82e404df6475d64dbfeaaa0f6cda8092... (25/25 cells)
  </text>

  <!-- GE-H2 Box -->
  <rect x="40" y="352" width="432" height="204" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="54" y="374" font-size="13.5" font-weight="bold" fill="#92400e">
    GE-H2 · Cross-ISA IEEE-754 f64 Controls (25,000 Ticks)
  </text>

  <g font-size="11.5" fill="#1e293b">
    <rect x="54" y="386" width="404" height="32" rx="5" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="64" y="401" font-weight="bold" fill="#065f46">Pinned f64 algebraic + sqrt (-ffp-contract=off, no trig):</text>
    <text x="64" y="414" fill="#047857">0-ULP identical across arm64, aarch64 &amp; x86_64 (&gt; 25,000 ticks)</text>

    <rect x="54" y="425" width="404" height="38" rx="5" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="64" y="440" font-weight="bold" fill="#991b1b">Cross-OS std::sin/cos (Apple libm vs GNU glibc, NO -ffast-math):</text>
    <text x="64" y="455" fill="#b91c1c">Bit flip t_div = 10 (0.17 s) → Gameplay desync t = 9,798 (163.3 s)</text>

    <rect x="54" y="470" width="404" height="38" rx="5" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="64" y="485" font-weight="bold" fill="#991b1b">Cross-ISA FMA (x86_64 VFMADD vs arm64 FMADD, NO -ffast-math):</text>
    <text x="64" y="500" fill="#b91c1c">Bit flip t_div = 406 (6.77 s) → Gameplay desync t = 11,205 (186.8 s)</text>

    <rect x="54" y="515" width="404" height="32" rx="5" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="64" y="530" font-weight="bold" fill="#991b1b">Cross-ISA V8 Math.sin (x86_64 v22 vs aarch64 v24): t_div = 66 → 10,093</text>
    <text x="64" y="543" fill="#b91c1c">Binary32 step-down (f64 vs f32 strict): t_div = 1 → Gameplay t = 1,370</text>
  </g>

  <!-- Center Determinism Boundary -->
  <line x1="510" y1="68" x2="510" y2="578" stroke="#dc2626" stroke-width="3" stroke-dasharray="9,6"/>
  <rect x="490" y="286" width="40" height="72" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="510" y="314" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">λ(s_t)</text>
  <text x="510" y="331" font-size="10" text-anchor="middle" fill="#991b1b">1-way</text>
  <text x="510" y="346" font-size="10" text-anchor="middle" fill="#991b1b">view</text>

  <!-- Right Panel: Tolerance Zone -->
  <rect x="532" y="72" width="484" height="500" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="774" y="98" font-size="15.5" text-anchor="middle" font-weight="bold" fill="#7c2d12">
    TOLERANCE ZONE · GE-H3 Cross-GPU wgpu (Downstream of λ)
  </text>
  <text x="774" y="116" font-size="12" text-anchor="middle" fill="#9a3412">
    512×512 RGBA8Unorm · 24/24 GPU frame pairs differ in SHA-256, 24/24 pass gate
  </text>

  <!-- Chart Area -->
  <rect x="548" y="132" width="452" height="332" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="562" y="153" font-size="12.5" font-weight="bold" fill="#0f172a">
    Minimum Pairwise PSNR across 4 Canonical Frames (Ticks 0, 250, 1k, 10k)
  </text>
  <text x="562" y="169" font-size="11" fill="#475569">
    Scale: 30 dB to 80 dB · Gate requires PSNR &gt; 40 dB, SSIM &gt; 0.999, p(|Δ| &gt; 8) ≤ 0.1%
  </text>

  <!-- X-axis scale: x=730 is 30 dB, x=980 is 80 dB (5 px per dB); 40 dB gate is x=780 -->
  <line x1="730" y1="182" x2="730" y2="432" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="830" y1="182" x2="830" y2="432" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="880" y1="182" x2="880" y2="432" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="930" y1="182" x2="930" y2="432" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="980" y1="182" x2="980" y2="432" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 40 dB Gate Line -->
  <line x1="780" y1="178" x2="780" y2="436" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="780" y="450" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#dc2626">40 dB Gate</text>
  <text x="730" y="450" font-size="10" text-anchor="middle" fill="#64748b">30</text>
  <text x="830" y="450" font-size="10" text-anchor="middle" fill="#64748b">50</text>
  <text x="880" y="450" font-size="10" text-anchor="middle" fill="#64748b">60</text>
  <text x="930" y="450" font-size="10" text-anchor="middle" fill="#64748b">70</text>
  <text x="980" y="450" font-size="10" text-anchor="middle" fill="#64748b">80 dB</text>

  <!-- Bars: width = (PSNR - 30) * 5 -->
  <g font-size="11" fill="#1e293b">
    <!-- Row 1: Apple Metal vs Intel ANV: 72.06 dB -> w = 210.3 -->
    <text x="724" y="201" text-anchor="end" font-weight="bold">Apple Metal vs Intel ANV</text>
    <rect x="730" y="188" width="210.3" height="18" rx="3" fill="#0d9488"/>
    <text x="945" y="201" font-size="10.5" font-weight="bold" fill="#0f766e">72.1 dB (1.3%)</text>

    <!-- Row 2: AMD RADV vs Apple Metal: 69.09 dB -> w = 195.5 -->
    <text x="724" y="235" text-anchor="end" font-weight="bold">AMD RADV vs Apple Metal</text>
    <rect x="730" y="222" width="195.5" height="18" rx="3" fill="#0d9488"/>
    <text x="931" y="235" font-size="10.5" font-weight="bold" fill="#0f766e">69.1 dB (Δ≤1)</text>

    <!-- Row 3: AMD RADV vs Intel ANV: 67.97 dB -> w = 189.9 -->
    <text x="724" y="269" text-anchor="end" font-weight="bold">AMD RADV vs Intel ANV</text>
    <rect x="730" y="256" width="189.9" height="18" rx="3" fill="#0d9488"/>
    <text x="925" y="269" font-size="10.5" font-weight="bold" fill="#0f766e">68.0 dB (3.8%)</text>

    <!-- Row 4: AMD RADV vs NVIDIA: 65.64 dB -> w = 178.2 -->
    <text x="724" y="303" text-anchor="end" font-weight="bold">AMD RADV vs NVIDIA RTX</text>
    <rect x="730" y="290" width="178.2" height="18" rx="3" fill="#0284c7"/>
    <text x="914" y="303" font-size="10.5" font-weight="bold" fill="#0369a1">65.6 dB (6.6%)</text>

    <!-- Row 5: Intel ANV vs NVIDIA: 64.79 dB -> w = 174.0 -->
    <text x="724" y="337" text-anchor="end" font-weight="bold">Intel ANV vs NVIDIA RTX</text>
    <rect x="730" y="324" width="174.0" height="18" rx="3" fill="#0284c7"/>
    <text x="910" y="337" font-size="10.5" font-weight="bold" fill="#0369a1">64.8 dB (8.3%)</text>

    <!-- Row 6: Apple Metal vs NVIDIA: 64.16 dB -> w = 170.8 -->
    <text x="724" y="371" text-anchor="end" font-weight="bold">Apple Metal vs NVIDIA RTX</text>
    <rect x="730" y="358" width="170.8" height="18" rx="3" fill="#0284c7"/>
    <text x="906" y="371" font-size="10.5" font-weight="bold" fill="#0369a1">64.2 dB (9.3%)</text>

    <!-- Row 7: Physical GPUs vs CPU Q16.16 Ref: 59.13 dB -> w = 145.7 -->
    <text x="724" y="409" text-anchor="end" fill="#475569">GPUs vs CPU Q16.16 Ref</text>
    <rect x="730" y="396" width="145.7" height="18" rx="3" fill="#d97706"/>
    <text x="882" y="409" font-size="10.5" font-weight="bold" fill="#b45309">59.1–60.6 dB (Δ≤2)</text>
  </g>

  <!-- Summary Card Bottom Right -->
  <rect x="548" y="476" width="452" height="80" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="562" y="497" font-size="12" font-weight="bold" fill="#78350f">
    Why Exact Pixel Hashing Fails Yet Bounded Conformance Holds:
  </text>
  <text x="562" y="516" font-size="11.2" fill="#451a03">
    • Hardware SFU sin/cos/pow &amp; ROP unorm8 rounding flip 1–2 LSB on 1.3%–9.3% of pixels.
  </text>
  <text x="562" y="533" font-size="11.2" fill="#451a03">
    • All 6 physical GPU pairs keep Δ_max ≤ 2/255, SSIM ≥ 0.99983, and 0 outliers &gt; ε = 8.
  </text>
  <text x="562" y="550" font-size="11.2" fill="#065f46" font-weight="bold">
    • CPU Q16.16 integer rasterizer is 100% bit-exact across arm64 &amp; x86_64 (0 mismatches).
  </text>

  <!-- Footer -->
  <rect x="24" y="584" width="992" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="520" y="604" font-size="11.5" text-anchor="middle" fill="#334155">
    Energy &amp; telemetry discipline: measured_j = None, board_metered = false · macOS L3 ri_energy_nj &amp; Linux L2 RAPL reported_j kept strictly separate.
  </text>
</svg>
