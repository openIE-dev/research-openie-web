<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-label="Unified SATB-IO, openie-cad, and JCP JCR-1 Provenance Lattice and Receipt Spine">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 17px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .sub { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #475569; }
      .col-h { font: 700 13px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; letter-spacing: 0.02em; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .tier-m { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
      .tier-r { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
      .tier-e { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
      .tier-n { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 5 3; }
      .gate { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
      .seal { fill: #0f172a; stroke: #334155; stroke-width: 1.5; }
      .lbl-b { font: 700 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .lbl-s { font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; }
      .lbl-w { font: 700 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #f8fafc; }
      .lbl-ws { font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #cbd5e1; }
      .arr { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .arr-bi { stroke: #0f172a; stroke-width: 1.6; fill: none; marker-start: url(#arrow-l); marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-l" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1.5 L 1.5 5 L 10 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="560" rx="12"/>
  <text class="title" x="32" y="34">Unified Provenance Meet-Semilattice &amp; Cryptographic Receipt Spine (SATB-IO ↔ openie-cad ↔ JCP JCR-1)</text>
  <text class="sub" x="32" y="54">Monotone meet (a ∧ b) prevents silent provenance or rail-coverage promotion across 280 × 280 = 78,400 tested state pairs</text>

  <!-- Column 1: SATB-IO -->
  <rect class="card" x="28" y="74" width="290" height="392" rx="10"/>
  <text class="col-h" x="44" y="99">1. SATB-IO Coordinate (L0..L4 × A1..N)</text>

  <rect class="tier-m" x="44" y="114" width="258" height="62" rx="7"/>
  <text class="lbl-b" x="56" y="135">(L0 | L1 | L2) + (A1 | A2 | B)</text>
  <text class="lbl-s" x="56" y="153">Inline physical rail shunt (INA238 / analyzer)</text>
  <text class="lbl-s" x="56" y="168">Evidence tier: measured_j</text>

  <rect class="tier-r" x="44" y="188" width="258" height="62" rx="7"/>
  <text class="lbl-b" x="56" y="209">(L1 | L2 | L3) + (A1 | A2 | B)</text>
  <text class="lbl-s" x="56" y="227">IOReport / RAPL / NVML / ri_energy_nj</text>
  <text class="lbl-s" x="56" y="242">Evidence tier: reported_j (vendor-opaque)</text>

  <rect class="tier-r" x="44" y="262" width="258" height="58" rx="7"/>
  <text class="lbl-b" x="56" y="283">(L2 | L3) + Attribution C</text>
  <text class="lbl-s" x="56" y="301">Kepler CPU-share / utilization split</text>
  <text class="lbl-s" x="56" y="314">Evidence tier: reported_j</text>

  <rect class="tier-e" x="44" y="332" width="258" height="58" rx="7"/>
  <text class="lbl-b" x="56" y="353">(L0..L3) + Attribution D</text>
  <text class="lbl-s" x="56" y="371">wall_s × W_est or deterministic OpCounter</text>
  <text class="lbl-s" x="56" y="384">Evidence tier: est_j</text>

  <rect class="tier-n" x="44" y="402" width="258" height="50" rx="7"/>
  <text class="lbl-b" x="56" y="423">L4 or Attribution (P | N)</text>
  <text class="lbl-s" x="56" y="441">Unattested remote API → not_available</text>

  <!-- Column 2: JCP Rung Projection & Meet Semilattice -->
  <rect class="card" x="364" y="74" width="276" height="392" rx="10"/>
  <text class="col-h" x="380" y="99">2. JCP Energy Rung &amp; Coverage</text>

  <rect class="tier-m" x="380" y="114" width="244" height="62" rx="7"/>
  <text class="lbl-b" x="392" y="135">HwShunt (Whole | Partial)</text>
  <text class="lbl-s" x="392" y="153">vendor_opaque = 0 · Rank 4</text>
  <text class="lbl-s" x="392" y="168">Whole ∧ Partial = Partial</text>

  <rect class="tier-r" x="380" y="188" width="244" height="62" rx="7"/>
  <text class="lbl-b" x="392" y="209">HwShunt (Vendor-Opaque)</text>
  <text class="lbl-s" x="392" y="227">vendor_opaque = 1 · Rank 3</text>
  <text class="lbl-s" x="392" y="242">Never promotes to measured_j</text>

  <rect class="tier-r" x="380" y="262" width="244" height="58" rx="7"/>
  <text class="lbl-b" x="392" y="283">ModelBased (Partial)</text>
  <text class="lbl-s" x="392" y="301">provenance = "ModelBased" · Rank 2</text>

  <rect class="tier-e" x="380" y="332" width="244" height="58" rx="7"/>
  <text class="lbl-b" x="392" y="353">Estimator (Whole | Partial)</text>
  <text class="lbl-s" x="392" y="371">provenance = "Estimator" · Rank 1</text>

  <rect class="tier-n" x="380" y="402" width="244" height="50" rx="7"/>
  <text class="lbl-b" x="392" y="423">None / NotAvailable</text>
  <text class="lbl-s" x="392" y="441">Rank 0 (absorbing bottom ⊥)</text>

  <!-- Bidirectional arrows Col 1 <-> Col 2 -->
  <line class="arr-bi" x1="306" y1="145" x2="376" y2="145"/>
  <line class="arr-bi" x1="306" y1="219" x2="376" y2="219"/>
  <line class="arr-bi" x1="306" y1="291" x2="376" y2="291"/>
  <line class="arr-bi" x1="306" y1="361" x2="376" y2="361"/>
  <line class="arr-bi" x1="306" y1="427" x2="376" y2="427"/>

  <!-- Column 3: openie-cad Tracts + Empirical Falsifier Gates -->
  <rect class="card" x="684" y="74" width="408" height="202" rx="10"/>
  <text class="col-h" x="700" y="99">3. openie-cad Tracts &amp; SATB Empirical Gates</text>

  <rect class="tier-e" x="700" y="112" width="376" height="44" rx="6"/>
  <text class="lbl-b" x="712" y="131">openie-cad SessionJoules Tracts</text>
  <text class="lbl-s" x="712" y="147">material · supply_chain · compute (cad-joules bracketed)</text>

  <rect class="gate" x="700" y="166" width="376" height="50" rx="6"/>
  <text class="lbl-b" x="712" y="185">SATB Falsifier 6: Baseline Drift &lt;= 5.00% (500 bps)</text>
  <text class="lbl-s" x="712" y="203">&gt; 5.0% drops derived_marginal_uj; seals raw_counter_uj</text>

  <rect class="gate" x="700" y="224" width="376" height="42" rx="6"/>
  <text class="lbl-b" x="712" y="242">SATB Step 7: Sequential Phase Sum Conservation</text>
  <text class="lbl-s" x="712" y="258">|sum(phase_uj) - window_uj| &lt;= 1 uJ</text>

  <!-- Column 3 Bottom: Sealed JCR-1 Chain & Replay -->
  <rect class="seal" x="684" y="294" width="408" height="172" rx="10"/>
  <text class="lbl-w" x="700" y="320">4. Canonical Det-CBOR JCR-1 + COSE_Sign1 (Ed25519)</text>
  <text class="lbl-ws" x="700" y="342">• Zero floats / booleans / nulls inside signed CBOR preimage</text>
  <text class="lbl-ws" x="700" y="361">• Two-phase Runtime::hold (held_uj) → Runtime::settle (settles)</text>
  <text class="lbl-ws" x="700" y="380">• Hash-chained seq / prev ContentId (BLAKE3-256)</text>
  <text class="lbl-ws" x="700" y="399">• Verified offline via jcp_receipt::verify_log(&amp;entries, pk)</text>
  <text class="lbl-ws" x="700" y="418">• Crash-recovery state rebuilt via jcp_receipt::replay_ledger</text>
  <text class="lbl-ws" x="700" y="437">• Outcome anchor sealed via jcp_efficiency (efficiency/1)</text>

  <line class="arr" x1="640" y1="220" x2="680" y2="191"/>
  <line class="arr" x1="888" y1="276" x2="888" y2="290"/>

  <!-- Footer Invariant Banner -->
  <rect x="28" y="484" width="1064" height="52" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text class="lbl-b" x="46" y="506">Session Lattice Floor Rule: session_tier = ⋀ stage_tier_i · MEI-JCP-Tag-v1 Fab Package: board_metered = false, measured_j = null</text>
  <text class="lbl-s" x="46" y="524">Host CAD/DRC/B-Rep/Sim compute stages record Linux RAPL package-0 deltas in reported_j alongside analytical est_j; physical bench shunt awaits PCB assembly.</text>
