<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Where coupled bits are written</title><desc id="d">Qualitative diagram placing three carriers of coupled bits on an axis of writing speed per second: the genome, through selection per generation, at about 0.29 bits per generation by Kimura; the brain, through learning within a lifetime; and tools and records, through culture across lifetimes.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker></defs><rect x="1" y="1" width="1198" height="518" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40.0" y="58.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a" text-anchor="start">Where coupled bits are written</text>
<text x="40.0" y="92.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Carriers ordered by the time each needs per written bit. Positions are qualitative.</text>
<rect x="946.5" y="26" width="213.5" height="34" rx="17" fill="none" stroke="#CC79A7" stroke-width="2"/>
<text x="1053.2" y="49.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#CC79A7" text-anchor="middle">Qualitative diagram</text>
<line x1="100.0" y1="330.0" x2="1100.0" y2="330.0" stroke="#0f172a" stroke-width="3" marker-end="url(#ah)"/>
<text x="1100.0" y="365.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="end">faster writing of bits, per second</text>
<path d="M220 309.2 L237.6 330 L220 350.8 L202.4 330 Z" stroke="#ffffff" stroke-width="2" fill="#E69F00" fill-opacity="1" stroke-linejoin="round"/>
<text x="220.0" y="250.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">Genome</text>
<text x="220.0" y="278.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569" text-anchor="middle">selection, per generation</text>
<text x="220.0" y="410.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E69F00" text-anchor="middle">about 0.29 bits per generation (Kimura [341])</text>
<rect x="584.0" y="314.0" width="32.0" height="32.0" rx="0" fill="#009E73" stroke="#ffffff" stroke-width="2" opacity="1"/>
<text x="600.0" y="250.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">Brain</text>
<text x="600.0" y="278.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569" text-anchor="middle">learning within a lifetime</text>
<text x="600.0" y="410.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#009E73" text-anchor="middle">written in seconds to years</text>
<circle cx="980.0" cy="330.0" r="16" fill="#0072B2" stroke="#ffffff" stroke-width="2"/>
<text x="980.0" y="250.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">Tools and records</text>
<text x="980.0" y="278.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569" text-anchor="middle">culture across lifetimes</text>
<text x="980.0" y="410.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0072B2" text-anchor="middle">copied and reused at once</text>
<text x="100.0" y="470.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Bounds on selection: Kimura [341], Worden [342], Hledík, Barton and Tkačik [343]. Every bound is per generation, so a generation that lengthens</text>
<text x="100.0" y="492.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">slows the genome per second; agency moves to brains and tools when the world changes faster than generations turn over.</text></svg>
