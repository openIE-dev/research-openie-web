<text x="40.0" y="92.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Correctness is the gate; joules are the ranking among what passes. Run 1 at the loose budget (Section 8.11).</text>
