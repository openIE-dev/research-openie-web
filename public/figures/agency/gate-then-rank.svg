<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Gate first, then rank by joules</title><desc id="d">Diagram and data. Candidate runs pass through the gate C of z, X at least X required. Those that pass are ranked by J star, the least joules to correct completion; those that fail are not ranked. Below, Run 1 at budget 2.0: sigma-law closed 28.40 of 30 tasks with run iota 73,345 bits per joule; fixed cascade 27.50 with 70,418; goal-blind 18.25 with 92,724. Integrated iota alone would rank the goal-blind agent first.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker></defs><rect x="1" y="1" width="1198" height="638" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
