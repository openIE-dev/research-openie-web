<text x="170.0" y="340.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Layer 2. Kinematics</text>
<text x="170.0" y="368.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569" text-anchor="start">how fast agency moves, per second and per joule</text>
<text x="170.0" y="394.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#009E73" text-anchor="start">Landauer floor, speed limits, TUR, data-rate theorem</text>
<rect x="200.0" y="160.0" width="800.0" height="110.0" rx="14" fill="#f8fafc" stroke="#E69F00" stroke-width="4" opacity="1"/>
