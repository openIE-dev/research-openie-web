<text x="230.0" y="254.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E69F00" text-anchor="start">ι = dX/dJ, confirmed bits per joule along a run</text></svg>
