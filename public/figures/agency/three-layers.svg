<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Agency in three layers</title><desc id="d">Diagram of three stacked layers. Bottom, layer 1: the definition and gate, eligibility, with four clauses: prediction first, coupling to the world, consequence borne, and the joule budget. Middle, layer 2: kinematics, how fast agency moves per second and per joule, bounded by the Landauer floor, speed limits, the thermodynamic uncertainty relation and the data-rate theorem. Top, layer 3: calculus, intelligence iota equals dX over dJ, read in hindsight.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker></defs><rect x="1" y="1" width="1198" height="598" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40.0" y="58.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a" text-anchor="start">Agency in three layers</text>
<text x="40.0" y="92.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Each layer presupposes the one below it.</text>
<rect x="1072.5" y="26" width="87.5" height="34" rx="17" fill="none" stroke="#CC79A7" stroke-width="2"/>
<text x="1116.2" y="49.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#CC79A7" text-anchor="middle">Diagram</text>
<rect x="80.0" y="440.0" width="1040.0" height="110.0" rx="14" fill="#f8fafc" stroke="#0072B2" stroke-width="4" opacity="1"/>
<text x="110.0" y="480.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Layer 1. Definition and gate</text>
<text x="110.0" y="508.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569" text-anchor="start">eligibility: what counts as an agent</text>
<text x="110.0" y="534.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0072B2" text-anchor="start">four clauses: prediction first, coupling to the world, consequence borne, J(a) ≤ B</text>
