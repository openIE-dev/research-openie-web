<text x="40.0" y="92.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Dated prices as printed by the sources in Section 2.11; log scale. Bundled items have no separate price.</text>
