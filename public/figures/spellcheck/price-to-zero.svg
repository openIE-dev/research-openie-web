<text x="120.0" y="600.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start" font-style="italic">Word 2.0 is placed by Brodie’s account (Section 2.11); its year is not printed on that tape. Hunspell is placed at the right edge, undated; its README publishes no prior retail schedule.</text></svg>
