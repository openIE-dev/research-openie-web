<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t2 d2">
  <title id="t2">512x512 Beneš-Copy-Beneš multicast fabric and 81-RAMB36E2 single-cycle LUT6 page cache</title>
  <desc id="d2">Hardware block diagram targeting AMD Kria KV260 xck26 in Yosys and Verilator simulation: 512-bit input bus enters 43-stage non-blocking Beneš-Copy-Beneš multicast switch (40,155 LUTs standalone), feeding 80 parallel LUT6 evaluators whose 64-bit INIT vectors switch in 1 clock cycle (4.0 ns at 250 MHz nominal) from an 81-RAMB36E2 hash-indexed page cache (41,186 total CLB LUTs, 0 DSP48s).</desc>
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/>
    </marker>
    <marker id="ah2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#009E73"/>
    </marker>
    <marker id="ah2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0072B2"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="468" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="54" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">Beneš–Copy–Beneš multicast fabric &amp; single-cycle BRAM LUT6 cache</text>
  <text x="40" y="84" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#475569">Replaces 119,478-LUT flat crossbars (102.0% KV260 overflow) and 926,619-LUT FF muxes with 41,186 LUTs + 81 RAMB36E2s.</text>
  <rect x="1072.5" y="24" width="87.5" height="34" rx="17" fill="none" stroke="#CC79A7" stroke-width="2"/>
  <text x="1116.2" y="47" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#CC79A7" text-anchor="middle">Diagram</text>

  <!-- Input Bus + Context Hash -->
  <rect x="40" y="125" width="210" height="118" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
  <text x="145" y="155" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">AXI4-Stream Input</text>
  <text x="145" y="180" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">512-bit feature / token bus</text>
  <text x="145" y="203" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">6-byte / 3-token context</text>
  <text x="145" y="224" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">9-bit XOR-fold slot [0..511]</text>

  <!-- Benes-Copy-Benes -->
  <rect x="305" y="115" width="320" height="138" rx="14" fill="#f8fafc" stroke="#0072B2" stroke-width="3"/>
  <text x="465" y="145" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="800" fill="#0f172a" text-anchor="middle">512×512 Beneš–Copy–Beneš</text>
  <text x="465" y="170" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0072B2" text-anchor="middle">B₁ (conc.) → C (fan-out) → B₂ (Waksman)</text>
  <text x="465" y="194" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">43 stages × 256 2×2 switches = 11,008 bits</text>
  <text x="465" y="216" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">480 arbitrary multicast ports (vs 192 flat)</text>
  <text x="465" y="237" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Zero Vivado re-PAR on topology drift</text>

  <!-- 81 RAMB36E2 Page Cache -->
  <rect x="305" y="285" width="320" height="115" rx="14" fill="#f8fafc" stroke="#E69F00" stroke-width="3"/>
  <text x="465" y="314" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">81 × RAMB36E2 Page Cache</text>
  <text x="465" y="338" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#b45309" text-anchor="middle">512 resident pages × 5,184 bits/page</text>
  <text x="465" y="361" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">5,120b LUT6 INIT + 48b tag + valid</text>
  <text x="465" y="383" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Dual-port: Port A AXIfill · Port B 1-cycle read</text>

  <!-- 80 Dynamic LUT6 Array -->
  <rect x="685" y="165" width="235" height="150" rx="14" fill="#f8fafc" stroke="#009E73" stroke-width="3"/>
  <text x="802.5" y="196" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="800" fill="#0f172a" text-anchor="middle">80 Dynamic LUT6 Core</text>
  <text x="802.5" y="221" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#009E73" text-anchor="middle">CPI = 1.0 (4.0 ns @ 250 MHz sim)</text>
  <text x="802.5" y="245" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">64-LUT6 L0 + 16-LUT6 L1</text>
  <text x="802.5" y="267" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">82× faster switch vs 82-cyc reload</text>
  <text x="802.5" y="290" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">22.5× fewer LUTs vs FF mux</text>

  <!-- Output / Synthesis Box -->
  <rect x="970" y="165" width="190" height="150" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
  <text x="1065" y="196" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">xck26 Netlist</text>
  <text x="1065" y="222" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">41,186 CLB LUTs</text>
  <text x="1065" y="245" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">35.2% of KV260 logic</text>
  <text x="1065" y="267" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">56.2% of KV260 BRAM</text>
  <text x="1065" y="290" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#009E73" text-anchor="middle">0 DSP48 slices</text>

  <!-- Arrows -->
  <path d="M250 184 L300 184" stroke="#0f172a" stroke-width="3" fill="none" marker-end="url(#ah2)"/>
  <path d="M145 243 L145 342 L300 342" stroke="#0f172a" stroke-width="2.5" fill="none" marker-end="url(#ah2)"/>
  <text x="222" y="332" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">9-bit hash + 48-bit tag</text>
  <path d="M625 184 L680 215" stroke="#0072B2" stroke-width="3" fill="none" marker-end="url(#ah2b)"/>
  <path d="M625 342 L680 270" stroke="#009E73" stroke-width="3" fill="none" marker-end="url(#ah2g)"/>
  <path d="M920 240 L965 240" stroke="#0f172a" stroke-width="3" fill="none" marker-end="url(#ah2)"/>

  <text x="600" y="438" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#475569" text-anchor="middle" font-style="italic">RTL synthesized with Yosys 0.71+ (synth_xilinx -family xcup) and cycle-verified in Verilator 5.054; board_metered=false here.</text>
</svg>
