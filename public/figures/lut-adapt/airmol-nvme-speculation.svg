<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t3 d3">
  <title id="t3">AirMoL zero-extra-sweep 4-bit NVMe layer streaming with universal 64-bit token LUT6 speculation</title>
  <desc id="d3">Flow diagram of AirMoL on 2026 hybrid models LiquidAI LFM2.5-350M and Qwen3.5-0.8B-Base: zero-FLOP uint64 joint-mode token LUT6 drafter proposes K tokens (4x16b or 3x18b), verified in a single F_NOCACHE 4-bit NVMe layer sweep of K+1 positions with in-RAM hybrid state rollback, yielding 100% lossless tokens while cutting NVMe read bytes by 2.75x to 2.86x.</desc>
  <defs>
    <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/>
    </marker>
    <marker id="ah3g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#009E73"/>
    </marker>
    <marker id="ah3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0072B2"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="468" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="54" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">AirMoL: 4-bit NVMe layer streaming + ≤64-bit token LUT6 speculation</text>
  <text x="40" y="84" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#475569">Amortizes sequential NVMe weight reads across K+1 verified tokens per sweep at 100% exact token parity.</text>
  <rect x="1072.5" y="24" width="87.5" height="34" rx="17" fill="none" stroke="#CC79A7" stroke-width="2"/>
  <text x="1116.2" y="47" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#CC79A7" text-anchor="middle">Diagram</text>

  <!-- Step 1: Token LUT6 Drafter -->
  <rect x="38" y="130" width="252" height="145" rx="14" fill="#f8fafc" stroke="#009E73" stroke-width="3"/>
  <text x="164" y="160" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">1. Token LUT6 Proposer</text>
  <text x="164" y="185" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#009E73" text-anchor="middle">0 draft FLOPs · 0 NVMe reads</text>
  <text x="164" y="208" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">K = ⌊64 / ⌈log₂|V|⌉⌋ in uint64</text>
  <text x="164" y="230" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">LFM2.5 (65K): 16b × 4 = 64b</text>
  <text x="164" y="251" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Qwen3.5 (248K): 18b × 3 = 54b</text>

  <!-- Step 2: Single NVMe Sweep -->
  <rect x="335" y="130" width="275" height="145" rx="14" fill="#f8fafc" stroke="#0072B2" stroke-width="3"/>
  <text x="472.5" y="160" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">2. Single 4-Bit NVMe Sweep</text>
  <text x="472.5" y="185" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0072B2" text-anchor="middle">Darwin F_NOCACHE + os.pread</text>
  <text x="472.5" y="208" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">Streams 1 layer shard at a time</text>
  <text x="472.5" y="230" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Evaluates [t₀, d₁..d_K] in 1 sweep</text>
  <text x="472.5" y="251" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">RAM: 128 MB (LFM) / 242.5 MB (Qwen)</text>

  <!-- Step 3: Exact Target Verify + Rollback -->
  <rect x="655" y="130" width="255" height="145" rx="14" fill="#f8fafc" stroke="#E69F00" stroke-width="3"/>
  <text x="782.5" y="160" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">3. Lossless Verify &amp; Rollback</text>
  <text x="782.5" y="185" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#b45309" text-anchor="middle">100.0% exact target parity</text>
  <text x="782.5" y="208" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">Accepts prefix m ∈ [0..K] + 1 bonus</text>
  <text x="782.5" y="230" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Snapshots O(1) SSM/Conv/DeltaNet</text>
  <text x="782.5" y="251" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">0 extra NVMe sweeps on mismatch</text>

  <!-- Step 4: Measured NVMe Results -->
  <rect x="955" y="130" width="207" height="145" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
  <text x="1058.5" y="160" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">Measured Savings</text>
  <text x="1058.5" y="186" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#009E73" text-anchor="middle">LFM2.5: 2.86 tok/sweep</text>
  <text x="1058.5" y="207" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">7.07 GB → 2.48 GB (6.26 tok/s)</text>
  <text x="1058.5" y="232" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0072B2" text-anchor="middle">Qwen3.5: 2.74 tok/sweep</text>
  <text x="1058.5" y="253" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">12.67 GB → 4.62 GB (8.45% RAM)</text>

  <!-- Arrows -->
  <path d="M290 202 L330 202" stroke="#0f172a" stroke-width="3" fill="none" marker-end="url(#ah3)"/>
  <path d="M610 202 L650 202" stroke="#0072B2" stroke-width="3" fill="none" marker-end="url(#ah3b)"/>
  <path d="M910 202 L950 202" stroke="#009E73" stroke-width="3" fill="none" marker-end="url(#ah3g)"/>

  <!-- Online Crystallization feedback bar -->
  <rect x="164" y="316" width="665" height="74" rx="12" fill="#f8fafc" stroke="#009E73" stroke-width="2.5"/>
  <text x="496.5" y="344" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">Online Wake-to-LUT6 Crystallization (Target-Verified Ground Truth)</text>
  <text x="496.5" y="368" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Verified target tokens update the 64-bit joint-minterm LUT6 page table; drafter proposes, target decides.</text>
  <path d="M875 275 L875 353 L834 353" stroke="#009E73" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#ah3g)"/>
  <path d="M164 353 L110 353 L110 280" stroke="#009E73" stroke-width="2.8" fill="none" marker-end="url(#ah3g)"/>

  <text x="600" y="438" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#475569" text-anchor="middle" font-style="italic">NVMe bytes, peak active RAM, exact token agreement, and wall-clock throughput measured on Apple M5 Max; joules unmetered.</text>
</svg>
