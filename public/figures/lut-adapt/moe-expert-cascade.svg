<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="505" viewBox="0 0 1200 505" role="img" aria-labelledby="t4 d4">
  <title id="t4">Expert-AirMoL router-sparse NVMe streaming and C(z)-verified downward skill crystallization up to 35B MoE</title>
  <desc id="d4">Architecture of scaled Mixture of Limits up to 8.47B LiquidAI LFM2.5-8B-A1B and 34.66B Qwen3.6-35B-A3B: Rung 0 BenesLUT6 and Sub1Bit-LUT6 draft in RAM; Expert-AirMoL reads only top-k routed INT4 experts off NVMe (12.30x I/O reduction on 35B); deterministic verifier C(z) gates commits (0.0% broken commits) and crystallizes verified Python skills downward.</desc>
  <defs>
    <marker id="ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/>
    </marker>
    <marker id="ah4g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#009E73"/>
    </marker>
    <marker id="ah4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0072B2"/>
    </marker>
    <marker id="ah4o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E69F00"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="503" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="52" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#0f172a">Frontier Expert-AirMoL (8.5B–35B MoE) + C(z)-Verified Skill Crystallization</text>
  <text x="40" y="81" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Router-indexed NVMe pread of active INT4 experts + LUT6 burst drafting + contract-verified AST promotion.</text>
  <rect x="1072.5" y="24" width="87.5" height="34" rx="17" fill="none" stroke="#CC79A7" stroke-width="2"/>
  <text x="1116.2" y="47" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#CC79A7" text-anchor="middle">Diagram</text>

  <!-- Box 1: Rung 0/1 Fast Path -->
  <rect x="36" y="144" width="256" height="162" rx="14" fill="#f8fafc" stroke="#009E73" stroke-width="3"/>
  <text x="164" y="174" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="800" fill="#0f172a" text-anchor="middle">1. Rung 0/1 LUT6 &amp; Skill</text>
  <text x="164" y="198" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#009E73" text-anchor="middle">0.00 bpw LUT6 · 0.58 bpw Draft</text>
  <text x="164" y="221" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.8" fill="#475569" text-anchor="middle">80-LUT6 Beneš spec router (0 MACs)</text>
  <text x="164" y="242" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.8" fill="#475569" text-anchor="middle">Sub1Bit-LUT6 (27.8× vs FP16, 0 MACs)</text>
  <text x="164" y="263" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.8" fill="#475569" text-anchor="middle">K = 3 token burst in 64-bit word</text>
  <text x="164" y="286" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Warm hit: ~1 ms · 0 NVMe reads</text>

  <!-- Box 2: Router-Indexed Expert-AirMoL -->
  <rect x="334" y="144" width="286" height="162" rx="14" fill="#f8fafc" stroke="#0072B2" stroke-width="3"/>
  <text x="477" y="174" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="800" fill="#0f172a" text-anchor="middle">2. Expert-AirMoL (8.5B / 35B)</text>
  <text x="477" y="198" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0072B2" text-anchor="middle">Top-k Indexed F_NOCACHE pread</text>
  <text x="477" y="221" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.8" fill="#475569" text-anchor="middle">LFM2.5-8B-A1B: 4/32 active experts</text>
  <text x="477" y="242" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.8" fill="#475569" text-anchor="middle">Qwen3.6-35B-A3B: 8/256 active experts</text>
  <text x="477" y="263" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.8" fill="#475569" text-anchor="middle">Skips 85%–94% inactive MoE weights</text>
  <text x="477" y="286" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">3.83% of 66.1 GB FP16 in active RAM</text>

  <!-- Box 3: Deterministic Contract C(z) -->
  <rect x="662" y="144" width="256" height="162" rx="14" fill="#f8fafc" stroke="#E69F00" stroke-width="3"/>
  <text x="790" y="174" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="800" fill="#0f172a" text-anchor="middle">3. Contract Gate C(z) ∈ {0,1}</text>
  <text x="790" y="198" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">0.0% broken commits admitted</text>
  <text x="790" y="221" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.8" fill="#475569" text-anchor="middle">AST + sandbox + boundary tests</text>
  <text x="790" y="242" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.8" fill="#475569" text-anchor="middle">Catches spec drift on cached skills</text>
  <text x="790" y="263" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.8" fill="#475569" text-anchor="middle">Feeds counterexample to Rung 3</text>
  <text x="790" y="286" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Theorem 1 exact promotion safety</text>

  <!-- Box 4: Measured Frontier Gains -->
  <rect x="960" y="144" width="204" height="162" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
  <text x="1062" y="174" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="800" fill="#0f172a" text-anchor="middle">Measured 8B / 35B</text>
  <text x="1062" y="200" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#009E73" text-anchor="middle">LFM 8.5B: 6.90× less I/O</text>
  <text x="1062" y="220" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.2" fill="#475569" text-anchor="middle">4.57 → 0.66 GB/tok (3.00 tok/sw)</text>
  <text x="1062" y="246" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0072B2" text-anchor="middle">Qwen 35B: 12.30× less I/O</text>
  <text x="1062" y="266" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.2" fill="#475569" text-anchor="middle">18.16 → 1.48 GB/tok (6.5× tok/s)</text>
  <text x="1062" y="288" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.2" font-weight="700" fill="#0f172a" text-anchor="middle">100.0% lossless token parity</text>

  <!-- Forward Arrows -->
  <path d="M292 225 L329 225" stroke="#0f172a" stroke-width="3" fill="none" marker-end="url(#ah4)"/>
  <path d="M620 225 L657 225" stroke="#0072B2" stroke-width="3" fill="none" marker-end="url(#ah4b)"/>
  <path d="M918 225 L955 225" stroke="#009E73" stroke-width="3" fill="none" marker-end="url(#ah4g)"/>

  <!-- Counterexample escalation arc (C(z) == 0 -> Expert-AirMoL repair) -->
  <path d="M748 144 L748 120 L512 120 L512 139" stroke="#E69F00" stroke-width="2.4" stroke-dasharray="6 4" fill="none" marker-end="url(#ah4o)"/>
  <text x="630" y="112" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.2" font-weight="700" fill="#b45309" text-anchor="middle">C(z) = 0 counterexample repair</text>

  <!-- Downward Crystallization Feedback Bar -->
  <rect x="136" y="346" width="748" height="78" rx="12" fill="#f8fafc" stroke="#009E73" stroke-width="2.5"/>
  <text x="510" y="374" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">C(z) = 1 Downward AST Skill + 512-Wire Beneš-LUT6 Crystallization</text>
  <text x="510" y="399" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.4" fill="#475569" text-anchor="middle">Certified Rung 3 solutions compile into Rung 1 AST canonical skills and 80-LUT6 signature pages; Wave-2 drift re-checked by C(z).</text>
  <path d="M902 306 L902 385 L889 385" stroke="#009E73" stroke-width="2.6" stroke-dasharray="6 4" fill="none" marker-end="url(#ah4g)"/>
  <path d="M136 385 L104 385 L104 311" stroke="#009E73" stroke-width="2.8" fill="none" marker-end="url(#ah4g)"/>

  <text x="600" y="470" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle" font-style="italic">Measured on Apple M5 Max across LiquidAI/LFM2.5-8B-A1B (8.47B) and Qwen/Qwen3.6-35B-A3B (34.66B); PMU system energy &amp; est_j separated.</text>
